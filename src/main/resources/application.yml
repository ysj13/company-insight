spring:
  application:
    name: company-insight
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/company_insight}
    username: ${DB_USERNAME:company_insight}
    password: ${DB_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

# API 문서(Swagger UI, /v3/api-docs). 기본은 꺼 두고 로컬에서만 API_DOCS_ENABLED=true로 켠다.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  # 응답 형식을 따로 적지 않은 API는 JSON으로 문서에 표시한다 (기본값은 */*)
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  dart:
    api-key: ${DART_API_KEY:}
    requests-per-second: 5
    retry-delay: 2s      # 일시 오류 재시도 간격. 2초 → 4초
    retry-jitter: 500ms
  gemini:
    api-key: ${GEMINI_API_KEY:}
  disclosure:
    # 앱이 뜬 직후 공시 목록을 받을 회사의 종목코드(쉼표로 구분). 비워 두면 받지 않는다
    collect-on-startup: ${DISCLOSURE_COLLECT_ON_STARTUP:}
    collect-months: 12   # 오늘까지 거슬러 올라가는 기간(개월)
  analysis:
    # 분석 대상 회사의 종목코드(쉼표로 구분). 이 회사들의 공시만 분석 작업 큐에 줄 세운다. 비워 두면 모든 회사
    target-stock-codes: ${ANALYSIS_TARGET_STOCK_CODES:}
    new-days: 3          # 접수일이 최근 며칠 안인 공시를 새 공시로 보고 과거분보다 먼저 처리한다
    stale-after: 10m     # 실행 중인 채로 이만큼 지난 작업은 끝을 보지 못한 실행으로 보고 되돌린다
    retry-delay: 5m      # 실패한 작업을 다시 꺼내기까지 기다리는 시간. 3번 실패하면 멈춘다
  financial:
    # 앱이 뜬 직후 재무를 받을 회사의 종목코드(쉼표로 구분). 비워 두면 받지 않는다
    collect-on-startup: ${FINANCIAL_COLLECT_ON_STARTUP:}
    collect-years: 3     # 올해를 포함해 거슬러 올라가는 사업연도 수
