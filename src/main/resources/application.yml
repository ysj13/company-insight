spring:
  application:
    name: company-insight
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/company_insight}
    username: ${DB_USERNAME:company_insight}
    password: ${DB_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

# API 문서(Swagger UI, /v3/api-docs). 기본은 꺼 두고 로컬에서만 API_DOCS_ENABLED=true로 켠다.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  # 응답 형식을 따로 적지 않은 API는 JSON으로 문서에 표시한다 (기본값은 */*)
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  dart:
    api-key: ${DART_API_KEY:}
    requests-per-second: 5
    retry-delay: 2s      # 일시 오류 재시도 간격. 2초 → 4초
    retry-jitter: 500ms
  gemini:
    api-key: ${GEMINI_API_KEY:}
  financial:
    # 앱이 뜬 직후 재무를 받을 회사의 종목코드(쉼표로 구분). 비워 두면 받지 않는다
    collect-on-startup: ${FINANCIAL_COLLECT_ON_STARTUP:}
    collect-years: 3     # 올해를 포함해 거슬러 올라가는 사업연도 수
    # true면 앱이 뜬 직후 저장된 원본(financial_raw)에서 재무 행을 다시 뽑는다. 뽑는 규칙을 고친 뒤 한 번 켠다
    reextract-on-startup: ${FINANCIAL_REEXTRACT_ON_STARTUP:false}
