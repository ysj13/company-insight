spring:
  application:
    name: company-insight
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/company_insight}
    username: ${DB_USERNAME:company_insight}
    password: ${DB_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

# API 문서(Swagger UI, /v3/api-docs). 기본은 꺼 두고 로컬에서만 API_DOCS_ENABLED=true로 켠다.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  # 응답 형식을 따로 적지 않은 API는 JSON으로 문서에 표시한다 (기본값은 */*)
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  dart:
    api-key: ${DART_API_KEY:}
    requests-per-second: 5
    retry-delay: 2s      # 일시 오류 재시도 간격. 2초 → 4초
    retry-jitter: 500ms
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.5-flash-lite
    connect-timeout: 10s
    read-timeout: 120s
    min-interval: 4500ms           # 호출 사이 간격. 무료 구간의 분당 15회를 넘지 않게
    quota-reset-zone: America/Los_Angeles   # 하루 한도가 풀리는 자정의 시간대 (확인하지 못한 값)
  disclosure:
    # 앱이 뜬 직후 공시 목록을 받을 회사의 종목코드(쉼표로 구분). 비워 두면 받지 않는다
    collect-on-startup: ${DISCLOSURE_COLLECT_ON_STARTUP:}
    collect-months: 12   # 오늘까지 거슬러 올라가는 기간(개월)
  analysis:
    # 분석 대상 회사의 종목코드(쉼표로 구분). 이 회사들의 공시만 분석 작업 큐에 줄 세운다. 비워 두면 모든 회사
    target-stock-codes: ${ANALYSIS_TARGET_STOCK_CODES:}
    new-days: 3          # 접수일이 최근 며칠 안인 공시를 새 공시로 보고 과거분보다 먼저 처리한다
    stale-after: 10m     # 실행 중인 채로 이만큼 지난 작업은 끝을 보지 못한 실행으로 보고 되돌린다
    retry-delay: 5m      # 실패한 작업을 다시 꺼내기까지 기다리는 시간. 3번 실패하면 멈춘다
  judgment:
    # 공시 한 건의 크기(영향도 1~3)를 정하는 값. 경계는 "이상 ~ 미만"이다
    impact:
      subsidiary-step-down: 1   # 자회사의 공시는 크기를 한 단계 낮춘다 (최소 1)
      earnings:                 # 잠정실적, 손익구조 변동. 영업이익 증감율의 절댓값(%)
        neutral-below: 10       # 이보다 작으면 중립
        medium-from: 30         # 이 이상이면 2
        large-from: 100         # 이 이상이면 3
        turnaround: 3           # 흑자 전환, 적자 전환
        deficit-widened: 1      # 두 기간 모두 적자이고 적자 폭이 늘었을 때
      share-increase:           # 유상증자, 주식 관련 사채 발행, 전환 청구 행사, 자기사채 매도. 새로 생기는 주식 ÷ 발행주식총수(%)
        medium-from: 5
        large-from: 20
        exercise-neutral-below: 1   # 전환·신주인수권·교환 청구 행사만. 이보다 작으면 중립
      share-decrease:           # 주식 소각. 소각 주식 수 ÷ 발행주식총수(%)
        medium-from: 1
        large-from: 5
      amount:                   # 공급계약(매출액 대비), 시설 투자·소송 청구(자기자본 대비). 비율(%)
        medium-from: 10
        large-from: 30
      guarantee:                # 채무보증·담보 제공, 금전 대여. 자기자본 대비(%). 이보다 작으면 중립
        negative-from: 30       # 이 이상이면 악재 1
        medium-from: 100        # 이 이상이면 악재 2
      borrowing:                # 차입. 자기자본 대비(%)
        negative-from: 50       # 이 이상이면 악재 1. 그 아래는 중립
      misconduct:               # 횡령·배임·제재
        embezzlement-minimum: 2 # 횡령·배임은 금액(자기자본 대비)이 작아도 이 크기
        accounting-violation: 2 # 회계처리기준 위반에 따른 조치. 금액이 없는 서식
      fixed:                    # 견줄 비율이 없는 것
        conversion-price-down: 1    # 시가 하락에 따른 전환가액 등의 하향 조정(악재)
        revaluation-gain: 1         # 자산 재평가로 자산이 늘어남(호재)
      audit:                    # 감사보고서 제출. 여럿에 해당하면 큰 값
        opinion-not-clean: 3    # 감사의견 한정·부적정·의견거절
        going-concern: 2        # 계속기업 존속 불확실성
        internal-control: 2     # 내부회계관리제도 비적정
      ownership:                # 지분 보고. 주주가 한 일이라 가장 큰 크기는 2
        trade-neutral-below: 0.01   # 매매 순증감 ÷ 발행주식총수(%). 이보다 작으면 중립
        trade-medium-from: 0.1      # 이 이상이면 2
        holding-medium-from: 1      # 대량보유상황보고서. 보유비율 증감(%p)이 이 이상이면 2
    # AI가 방향을 정한 공시의 크기. 비율 유형(타법인 주식 F4, 자산 양수도 F5, 판결 I1, 제3자배정 D1)은 위의 경계를 쓴다
    ai-impact:
      fixed:                    # 유형마다 하나 (호재·악재 모두)
        B3: 1                   # 장래 사업·경영 계획
        C3: 2                   # 기술 계약·특허·임상
        D6: 1                   # 해외 상장·이전상장
        E4: 1                   # 자기주식 처분 (악재로 판정될 때)
        F2: 2                   # 회사 분할 (물적분할)
        F3: 2                   # 주식 교환·이전
        G1: 2                   # 최대주주 변경
        G2: 2                   # 경영권 양수도 계약
        G5: 2                   # 경영권 분쟁 소송의 인용 판결·결정
        G7: 1                   # 종속회사 상장
        I2: 2                   # 횡령·배임 혐의 진행사항 (횡령·배임의 가장 작은 크기와 같게)
        I4: 1                   # 파생상품 거래 손실, 채권 손상차손
        J7: 1                   # 풍문 해명
      by-tone:                  # 호재와 악재의 크기가 다른 유형
        E8:                     # 감자: 결손 보전 무상감자(악재), 자기주식 소각 방식(호재)
          positive: 2
          negative: 3
        I3:                     # 회생·파산·부도·연체: 해소(호재), 개시·신청·부도(악재)
          positive: 2
          negative: 3
      cases:                    # AI가 함께 고른 경우마다
        F1:                     # 합병
          SMALL: 1              # 소규모·간이합병, 완전자회사 흡수
          NORMAL: 2
        J1:                     # 관리종목·상장폐지 관련 안내
          DELISTING: 3          # 상장폐지 사유, 실질심사 대상
          DESIGNATION: 2        # 관리종목 지정, 지정 우려 예고
          RECURRING: 1          # 되풀이되는 우려 안내
          RELIEF: 2             # 벗어남 (호재)
      dissolution: 1            # 해산사유 발생
      withdrawal: 1             # 제목 꼬리에 철회·취하가 든 공시
      fallback: 1               # 어디에도 없을 때
  financial:
    # 앱이 뜬 직후 재무를 받을 회사의 종목코드(쉼표로 구분). 비워 두면 받지 않는다
    collect-on-startup: ${FINANCIAL_COLLECT_ON_STARTUP:}
    collect-years: 3     # 올해를 포함해 거슬러 올라가는 사업연도 수
