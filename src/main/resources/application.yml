spring:
  application:
    name: company-insight
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/company_insight}
    username: ${DB_USERNAME:company_insight}
    password: ${DB_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  dart:
    api-key: ${DART_API_KEY:}
    requests-per-second: 5
    retry-delay: 2s      # 일시 오류 재시도 간격. 2초 → 4초
    retry-jitter: 500ms
  gemini:
    api-key: ${GEMINI_API_KEY:}
