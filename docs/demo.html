<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기업 인사이트 데모</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 종목 화면 데모.
   머리: 회사 이름 + 판단(색 글자), 종목코드 · 시장 · 기준일
   탭: 공시(AI 요약 카드 + 공시 타임라인) · 개요 · 재무 · 뉴스. 탭은 상단 바 아래에 붙어 따라온다
   공시 한 건과 뉴스 한 건은 아래에서 올라오는 패널로 본다(넓은 화면도 같다)
   화면 상태: 불러오는 중(자리 표시), 분석 실패, 불러오기 오류, 공시 없는 회사, 검색 결과 없음. 화면 아래 "데모 화면 상태"로 바꿔 본다.
   규칙은 DESIGN.md, 부품과 상태 전체는 design-system.html.
   색·간격·모서리·글자 크기는 모두 아래 토큰으로만 쓴다(라이트 모드는 토큰 블록을 하나 더해 붙인다). */
:root{
  /* 회색 단계표: 같은 계열(살짝 차가운 회색). 숫자가 작을수록 밝다 */
  --g200:#e4e4e7; --g300:#d4d4d8; --g400:#a1a1aa; --g450:#93939c; --g600:#52525b; --g700:#3f3f46; --g800:#27272a; --g900:#18181b; --g925:#111113; --g950:#09090b;
  --bg:var(--g950); /* 거의 검정. 순수 검정(#000) 위 순수 흰색은 글자가 번져 보여 둘 다 한 단계씩 낮춘다 */
  --card:var(--g925); /* 카드 */
  --surface:var(--g900); /* 카드 안의 한 단계 들어간 칸, 입력창 */
  /* 위에 떠 있는 유리. 패널은 --g950 80%, 상단 바는 더 비치게 45% + 옅은 흰 기운 + 밝은 반투명 아래 테두리 */
  --glass-solid:rgba(9,9,11,.8); --glass-bar:rgba(9,9,11,.45); --glass-sheen:rgba(255,255,255,.04); --glass-edge:rgba(255,255,255,.1); --glass-blur:24px;
  --text:var(--g200); --text-sub:var(--g400); --text-faint:var(--g450);
  --line:var(--g800); --line-hover:var(--g700); --line-selected:var(--g600);
  /* 면의 상태: hover는 지금 면보다 한 단계, 누름·선택은 두 단계 밝게 */
  --fill-hover:var(--g900); --fill-selected:var(--g800); /* 카드 위의 줄·글자형 버튼(기본 면 없음) */
  --btn:var(--g900); --btn-hover:var(--g800); --btn-press:var(--g700); /* 보조 버튼·세그먼트(기본 면 900) */
  --primary:var(--g200); --primary-hover:var(--g300); --primary-press:var(--g400); --on-primary:var(--g950); /* 주 버튼(밝은 면) */
  --focus:rgba(255,255,255,.6);
  --up:#ff5c69; --up-soft:rgba(255,92,105,.12); --down:#4c94ff; --down-soft:rgba(76,148,255,.12); --flat:var(--g400); --flat-soft:var(--g800);
  --ai:#a78bfa; --ai-wash:rgba(167,139,250,.06); --ai-line:rgba(167,139,250,.32);
  --scrim:rgba(0,0,0,.55);
  /* 그래프 색: 지표마다 고정한다(매출은 어느 그래프에서나 파랑). 비율 선은 모두 밝은 회색. 그래프 안에서만 쓰고 글자·면의 뜻 색으로 쓰지 않는다 */
  --vz-blue:#3987e5; --vz-teal:#199e70; --vz-amber:#c98500; --vz-violet:#9085e9; --vz-orange:#d95926; --vz-rest:var(--g600); --vz-line:var(--g300);
  /* 본문 너비(좌우 여백 포함). 상단 바 안쪽, 본문, 아래 패널이 모두 따른다 */
  --page:640px;
  /* 간격: 4px 단계 일곱 개만 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px;
  /* 모서리: 둥근 사각형 한 가족, 세 가지만. 큰 면(카드·패널) 16 / 안쪽 것(칸·버튼·세그먼트·입력창·줄) 12 / 높이 24px의 작은 칩 8 */
  --r-lg:16px; --r-md:12px; --r-sm:8px;
  /* 글자 크기: 다섯 개 + 좁은 화면의 회사 이름 24 */
  --fs-title:28px; --fs-value:20px; --fs-card:17px; --fs-body:15px; --fs-small:13px;
  --fast:.2s cubic-bezier(.4,0,.2,1);
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs-body);font-weight:400;line-height:1.6;letter-spacing:-.01em;margin:0;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere} /* 한글은 단어 중간에서 줄을 바꾸지 않는다 */
h1,h2,h3,p{margin:0} h1,h2{text-wrap:balance}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
:is(a,button,input,select,[tabindex]):focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gutter{padding-left:max(var(--s4),env(safe-area-inset-left,0px));padding-right:max(var(--s4),env(safe-area-inset-right,0px))}
.inner{max-width:var(--page);margin:0 auto}

/* ───────── 글자 역할: 이 여덟 가지만 쓴다 ───────── */
/* 화면 제목 28/800 (폭 600px 이하 24): 회사 이름 */
h1{font-size:var(--fs-title);font-weight:800;line-height:1.3;letter-spacing:-.03em}
/* 큰 값 20/800: 패널 제목 */
.dv-title{font-size:var(--fs-value);font-weight:800;line-height:1.3;letter-spacing:-.02em}
/* 카드 제목 17/700: 카드·묶음 제목, 로고 글자, 상태 안내의 제목. 회사 이름 옆 판단은 같은 크기에 800 */
.card-title,.blk-h,.logo{font-size:var(--fs-card);font-weight:700;line-height:1.4;letter-spacing:-.02em}
.verdict{font-size:var(--fs-card);font-weight:800;line-height:1.4;letter-spacing:-.02em}
/* 줄 제목 15/600: 목록 한 줄의 제목, 버튼·탭 글자 */
.row-title,.btn,.tabs button{font-size:var(--fs-body);font-weight:600;line-height:1.5}
/* 본문 15/400: 문단, 요약 (body 기본값) */
/* 칸 제목 13/700 보조색: AI 칸의 이름표(보라) */
.box-title{font-size:var(--fs-small);font-weight:700;line-height:1.5;color:var(--text-sub);letter-spacing:0}
/* 라벨 13/600: 칩, 세그먼트 버튼, 글자형 버튼 */
.chip,.tone,.seg button,.tbtn{font-size:var(--fs-small);font-weight:600;line-height:1.5;letter-spacing:0}
/* 메타 13/400: 날짜·출처(옅은 색), 고지(보조색) */
.meta{font-size:var(--fs-small);font-weight:400;line-height:1.5;color:var(--text-sub);letter-spacing:0}
.meta.faint{color:var(--text-faint)}

/* ───────── 아이콘: 24 칸에 그린 선 아이콘, 선 굵기는 크기와 상관없이 1.5px ───────── */
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.i *{vector-effect:non-scaling-stroke}
.i.sm{width:16px;height:16px}

/* ───────── 부품 ───────── */
/* 버튼: 주(밝은 면, 화면에 하나), 보조(회색 면 + 테두리), 글자형(면 없음), 아이콘(44px 정사각) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:44px;padding:0 var(--s4);border-radius:var(--r-md);border:1px solid var(--line-hover);background:var(--btn);color:var(--text);text-decoration:none;transition:border-color var(--fast),background var(--fast),color var(--fast)}
.btn:hover{background:var(--btn-hover);border-color:var(--line-selected)}
.btn:active{background:var(--btn-press)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.primary:active{background:var(--primary-press);border-color:var(--primary-press)}
.btn.icon{min-width:44px;padding:0;border-color:transparent;background:none}
.btn.icon:hover{background:var(--fill-hover)} .btn.icon:active{background:var(--fill-selected)}
.tbtn{display:inline-flex;align-items:center;gap:var(--s1);text-decoration:none;min-height:44px;padding:0 var(--s2);margin:0 calc(-1 * var(--s2));border-radius:var(--r-md);color:var(--text-sub);transition:color var(--fast),background var(--fast)}
.tbtn:hover{color:var(--text);background:var(--fill-hover)}
.tbtn:active{background:var(--fill-selected)}
:is(.btn,.tbtn,.seg button):disabled{opacity:.4;cursor:default;pointer-events:none}
/* 세그먼트(같은 내용을 다른 범위로 보는 선택만): 선택은 밝은 면 */
.seg{display:inline-flex;gap:var(--s2);flex-wrap:wrap}
.seg button{min-height:36px;padding:0 var(--s4);border-radius:var(--r-md);border:1px solid var(--line-hover);background:var(--btn);color:var(--text-sub);transition:border-color var(--fast),background var(--fast),color var(--fast)}
.seg button:hover{border-color:var(--line-selected);background:var(--btn-hover);color:var(--text)}
.seg button:active{background:var(--btn-press);color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:700}
/* 칩(누를 수 없는 표시): 호재·악재·중립과 "뉴스". 기호 없이 글자로. 면은 불투명 카드색 위에 겹친 옅은 색으로 고정 */
.tone,.chip{display:inline-flex;align-items:center;gap:var(--s1);height:24px;padding:0 var(--s2);border-radius:var(--r-sm);white-space:nowrap}
.tone.up{background:linear-gradient(var(--up-soft),var(--up-soft)),var(--card);color:var(--up)}
.tone.down{background:linear-gradient(var(--down-soft),var(--down-soft)),var(--card);color:var(--down)}
.tone.flat{background:linear-gradient(var(--flat-soft),var(--flat-soft)),var(--card);color:var(--text-sub)}
.chip{color:var(--text-sub);border:1px solid var(--line-hover)}
/* 입력창 */
.field{position:relative}
.field .i{position:absolute;left:var(--s3);top:50%;margin-top:-10px;color:var(--text-faint);pointer-events:none}
.field input{width:100%;height:44px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);color:var(--text);padding:0 var(--s3) 0 40px;font:inherit;font-size:var(--fs-body);transition:border-color var(--fast)}
.field input::placeholder{color:var(--text-faint)}
.field input:hover{border-color:var(--line-hover)}
.field input:focus{border-color:var(--line-selected)}
/* 카드: 한 색의 면(925) + 가는 회색 테두리(800). 누를 수 없어서 hover가 없다 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s6);min-width:0}
/* 카드 안의 칸(빈 상태, 요약 띠) */
.box{background:var(--surface);border-radius:var(--r-md);padding:var(--s4)}
/* AI가 쓴 글은 옅은 보라 면 + 보라 테두리 칸에 넣고, 칸 위쪽에 작은 보라 글자 "AI 요약"을 이름표로 단다. 보라는 AI 전용 */
.ai-box{background:linear-gradient(var(--ai-wash),var(--ai-wash)),var(--card);border:1px solid var(--ai-line);border-radius:var(--r-md);padding:var(--s4)}
.ai-tag{color:var(--ai);margin-bottom:var(--s1)}
/* 빈 상태·검색 결과 없음: 왜 없는지(줄 제목)와 언제 생기는지(메타) */
.empty{display:flex;gap:var(--s3);align-items:flex-start}
.empty>.i{color:var(--text-faint);margin-top:calc((1.5em - 20px) / 2)}
.empty .meta{margin-top:var(--s1)}
/* 불러오는 중: 실제 배치와 같은 자리에 회색 면(900). 느리게 한 번씩 옅어진다 */
.sk{display:block;background:var(--surface);border-radius:var(--r-md);animation:pulse 1.6s cubic-bezier(.4,0,.2,1) infinite}
@keyframes pulse{50%{opacity:.5}}

/* ───────── 상단 바: 위에 떠 있는 유리 ───────── */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:1px solid var(--glass-edge);
  background:linear-gradient(var(--glass-sheen),var(--glass-sheen)),var(--glass-bar);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);backdrop-filter:blur(var(--glass-blur)) saturate(180%)}
.appbar .field input{background:rgba(255,255,255,.06)} .appbar .field input:not(:hover):not(:focus){border-color:var(--glass-edge)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.appbar .inner{display:flex;align-items:center;gap:var(--s3);padding-block:var(--s3)}
.logo{display:flex;align-items:center;gap:var(--s2);white-space:nowrap}
/* 로고: 둥근 칸을 밝은 면으로 채우고 겹친 층 아이콘을 바탕색으로 */
.logo .mark{width:32px;height:32px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--text);color:var(--bg)}
.logo .mark svg{width:18px;height:18px}
.search{flex:1;min-width:0;max-width:420px;position:relative}
.sug{position:absolute;left:0;right:0;top:calc(100% + var(--s1));background:var(--card);border:1px solid var(--line-hover);border-radius:var(--r-md);overflow:hidden;z-index:30}
.sug button{display:flex;justify-content:space-between;gap:var(--s3);width:100%;min-height:44px;align-items:center;padding:var(--s2) var(--s3);transition:background var(--fast)}
.sug button:hover,.sug button.on{background:var(--fill-selected)} /* 고른 줄은 800(카드 925와 900은 거의 구분되지 않는다) */
.sug .empty{padding:var(--s3)}

/* ───────── 종목 화면 ───────── */
main.inner{display:grid;gap:var(--s6);padding-block:var(--s8) var(--s12)}
/* 머리: 회사 이름 옆에 판단(색 글자), 그 아래 종목코드 · 시장 · 기준일. 이름이 길면 판단이 다음 줄로 내려간다 */
.co .nm{display:flex;align-items:center;gap:var(--s1) var(--s3);flex-wrap:wrap}
.co .meta{margin-top:var(--s1)}
.verdict{color:var(--text-sub)} .verdict.up{color:var(--up)} .verdict.down{color:var(--down)} .verdict.flat{color:var(--text)} /* 판단 보류는 보조색 */
/* 탭: 회사 이름 바로 아래, 상단 바 아래에 붙어 따라온다(--ab = 상단 바 높이). 선택은 흰 글자 + 흰 밑줄 */
.tabs{position:sticky;top:calc(var(--ab,69px) + env(safe-area-inset-top,0px));z-index:4;display:flex;gap:var(--s6);padding:0 var(--s1);background:var(--bg);border-bottom:1px solid var(--line)}
.tabs button{min-height:48px;padding:0 var(--s1);color:var(--text-sub);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color var(--fast),border-color var(--fast)}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--text)}
#panel{display:grid;gap:var(--s6)}
#panel[data-panel="news"] .card-title{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap} /* 탭 이름이 곧 제목 */
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);flex-wrap:wrap}
.more{display:flex;justify-content:center;width:100%;margin:var(--s2) 0 0}
.new-tag{display:inline-block;margin-right:var(--s2);font-size:var(--fs-small);font-weight:700;color:var(--text)}

/* 공시 탭 ①: AI 요약 카드. 카드 전체가 AI가 쓴 글의 칸(보라 테두리, 옅은 보라 면)이고 아래에 고지 */
.aicard{background:linear-gradient(var(--ai-wash),var(--ai-wash)),var(--card);border:1px solid var(--ai-line);border-radius:var(--r-lg);padding:var(--s6);min-width:0}
.brief{margin:0;padding-left:var(--s4);display:grid;gap:var(--s2)}
.foot{margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--line)}
.stale{opacity:.6} /* 분석 실패 때 지난 판단 */
.fail{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s4);padding:var(--s3) var(--s4);border:1px solid var(--line-hover);border-radius:var(--r-md)}

/* 공시 탭 ②: 공시 타임라인. 세로 선 하나를 따라 위가 앞날(빈 점), 흰 큰 점이 오늘, 아래로 지난 공시.
   점의 색은 호재·악재, 점의 크기는 영향(작음 8 / 보통 11 / 큼 15px), 공시 사이 간격은 날짜 차이(하루 5px, 최대 14일치). 줄 나눔선은 없다 */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:7.5px;top:var(--s3);bottom:var(--s6);width:1px;background:var(--line-hover)}
.tl>li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:0 var(--s3);padding-top:var(--gap,0px)}
.tl .n{width:16px;height:16px;margin-top:calc(var(--s2) + 2px);display:grid;place-items:center;background:var(--card);position:relative;z-index:1}
.tl .n::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--flat)}
.tl .n.up::after{background:var(--up)} .tl .n.down::after{background:var(--down)}
.tl .n.i1::after{width:8px;height:8px} .tl .n.i2::after{width:11px;height:11px} .tl .n.i3::after{width:15px;height:15px}
.tl .plan .n::after{background:none;box-shadow:inset 0 0 0 1.5px var(--text-faint)}
.tl .today .n::after{width:14px;height:14px;background:var(--text)}
.tl .t3{display:grid;padding:var(--s2);margin:0 calc(var(--s2) * -1);width:calc(100% + var(--s4));border-radius:var(--r-md);text-align:left;transition:background var(--fast)}
.tl .item:hover{background:var(--fill-hover)} .tl .item:active,.tl .item[aria-current="true"]{background:var(--fill-selected)}

const AI = `<p class="box-title ai-tag">AI 요약</p>`;
const NOTICE = `AI 요약은 틀릴 수 있으며 투자 권유가 아니에요.`;

/* view: ok 정상 / loading 불러오는 중 / fail 분석 실패(지난 판단을 보여줌) / error 불러오기 오류
   tab: disc 공시 / overview 개요 / fin 재무 / news 뉴스 (실제 화면에서는 탭마다 주소가 붙는다) */
const TABS = [["disc","공시"],["overview","개요"],["fin","재무"],["news","뉴스"]];
let AF = {tone:"all", g:"all", y:"all", q:"", p:1};
let state = { page:"co", tab:"disc", code:"005930", view:"ok", dv:null };

/* ───────── 공시 ─────────
   공시마다 주소(#d=…)를 붙여 공유와 뒤로 가기가 된다. 실제 화면에서는 DART 접수번호를 쓴다 */
const keyOf = e => e.d+"|"+e.t+"|"+e.r;
/* 전체 공시 화면의 예시 데이터: 실제 공시(events)에 2년치 중립 공시를 섞는다. 판단 계산에는 쓰지 않는다 */
const FILL = [["지분 보고","임원ㆍ주요주주특정증권등소유상황보고서","임원 보유 주식 변동 보고"],["지분 보고","임원ㆍ주요주주특정증권등소유상황보고서","임원 보유 주식 변동 보고"],
  ["지분 보고","최대주주등소유주식변동신고서","최대주주 측 보유 주식 변동 신고"],["기타","동일인등출자계열회사와의상품ㆍ용역거래변경","계열회사와의 거래 조건 변경"],
  ["IR·일정","기업설명회(IR)개최(안내공시)","기업설명회 개최 안내"],["기타","기업지배구조보고서공시","기업지배구조보고서 제출"]];
const allCache = {};
function allEvents(co){
  const code = Object.keys(DB).find(c=>DB[c]===co); if(allCache[code]) return allCache[code];
  if(!co.events.length) return (allCache[code] = []);
  let seed = [...code].reduce((a,c)=>a*31+c.charCodeAt(0),7) % 9973; const rnd = () => (seed = seed*48271 % 2147483647) / 2147483647;
  const out = [...co.events], start = dnum("2024-11-07"), end = dnum("2026-11-06"), have = new Set(co.events.map(e=>e.d));
  for(let t=start; t<=end; t += 2 + Math.floor(rnd()*4)){ const d = new Date(t*86400000).toISOString().slice(0,10), w = new Date(t*86400000).getUTCDay();
    if(w===0||w===6||have.has(d)) continue; const [g,tt,r] = FILL[Math.floor(rnd()*FILL.length)]; out.push({d,tone:"flat",imp:0,g,by:"제목 규칙",t:tt,r,fill:true}); }
  for(const [d,tt,r] of [["2025-03-11","사업보고서 (2024.12)","2024년 사업보고서 제출"],["2025-05-15","분기보고서 (2025.03)","2025년 1분기 보고서 제출"],["2025-08-14","반기보고서 (2025.06)","2025년 반기보고서 제출"],["2025-11-14","분기보고서 (2025.09)","2025년 3분기 보고서 제출"],["2026-03-10","사업보고서 (2025.12)","2025년 사업보고서 제출"],["2026-05-15","분기보고서 (2026.03)","2026년 1분기 보고서 제출"]])
    out.push({d,tone:"flat",imp:0,g:"정기보고서",by:"제목 규칙",t:tt,r,fill:true});
  return (allCache[code] = out.sort((a,b)=>b.d.localeCompare(a.d)));
}
const findEv = (co,key) => allEvents(co).find(e=>keyOf(e)===key);

/* 공시 한 건(패널): 호재·악재와 영향 → 쉬운 말 한 줄(제목) → "날짜 · DART 공시 이름"(원문 링크) → AI 3줄 요약 → 고지 */
function dvHTML(co, e){
  const sum = e.s
    ? `<div class="ai-box">${AI}<ul>${e.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`
    : e.tone==="flat" ? "" /* 중립 공시는 요약하지 않는다: 제목과 원문 링크만 */
    : `<p class="ai-wait"><span class="box-title ai-tag">AI 요약</span><span class="meta">준비 중</span></p>`; /* 호재·악재인데 요약이 아직 없을 때 */
  return `<div class="dv">
    <div class="dv-verdict meta num"><span class="tone ${e.tone}">${TONE[e.tone]}</span>${e.imp?`<span>영향 ${SIZE[e.imp]}</span>`:""}</div>
    <h2 class="dv-title" id="dv-title">${esc(e.r)}</h2>
    <a class="dv-srclink meta num" href="${DART}" target="_blank" rel="noopener">${ymd(e.d)} · DART ${esc(e.t)}${icon("external","sm")}<span class="sr">(새 창)</span></a>
    ${sum}
    ${e.s ? `<p class="notice meta">${NOTICE}</p>` : ""}</div>`;
}
/* 뉴스 한 건(패널): 뉴스 칩 → 제목 → 언론사 · 시각 → 원문 기사 보기. 요약은 보류(본문을 저장·표시하지 않는다) */
const newsWhen = n => n[0]==="오늘" ? n[3] : n[0]==="어제" ? "어제 "+n[3] : n[0]+" "+n[3];
const newsHTML = n => `<div class="dv">
    <div class="dv-verdict meta"><span class="chip">뉴스</span></div>
    <h2 class="dv-title" id="dv-title">${esc(n[1])}</h2>
    <p class="meta num">${esc(n[2])} · ${esc(newsWhen(n))}</p>
    <a class="btn news-src" href="#" onclick="return false">원문 기사 보기${icon("external","sm")}<span class="sr">(새 창)</span></a></div>`;
const mineNews = co => (NEWS[state.code]||[]).filter(x=>x[1].includes(co.name));

/* 이전·다음 (날짜순, 이전 = 더 오래된 것). 종목 화면에서는 모은 공시, 전체 공시 화면에서는 그 목록 순서 */
function neighbors(co,key){ const l=state.page==="all" ? allEvents(co) : [...co.events].sort((a,b)=>b.d.localeCompare(a.d)), i=l.findIndex(e=>keyOf(e)===key); return { older:l[i+1]||null, newer:l[i-1]||null }; }
const navBtns = (co,key) => { const {older,newer}=neighbors(co,key);
  return `<button type="button" class="tbtn num" data-step="${older?esc(keyOf(older)):""}" ${older?"":"disabled"}>${icon("prev","sm")}이전 공시${older?" "+md(older.d):""}</button><button type="button" class="tbtn num" data-step="${newer?esc(keyOf(newer)):""}" ${newer?"":"disabled"}>다음 공시${newer?" "+md(newer.d):""}${icon("next","sm")}</button>`; };

/* ───────── 머리와 공시 탭 ───────── */
const judgeDay = () => state.view==="fail" ? DATES[LAST-1] : ASOF;
function head(co){
  const now = scoreAt(co, judgeDay()), [vText,vCls] = now.hold ? ["판단 보류","hold"] : verdictOf(now.s);
  return `<div class="co"><div class="nm"><h1>${esc(co.name)}</h1><span class="verdict ${vCls}">${vText}</span></div><div class="meta num">${state.code} · ${co.market} · ${md(judgeDay())} 기준</div></div>`;
}
/* ① AI 요약 카드: 판단의 근거를 문장으로. 판단 이름은 머리에 있다 */
function aiCard(co){
  const fail = state.view==="fail", day = judgeDay(), now = scoreAt(co, day);
  const failBox = fail ? `<div class="fail meta"><span>${md(ASOF)} 공시 분석이 끝나지 않아 ${md(day)} 판단을 보여주고 있어요. 새 공시는 다음 분석 때 반영돼요.</span><button type="button" class="btn" data-retry>${icon("reload")}다시 불러오기</button></div>` : "";
  if(now.hold){ /* 판단 보류: AI가 쓴 글이 아니라 보라 칸이 아닌 보통 카드 */
    const none = !co.events.length;
    return `<section class="card" aria-label="판단 보류"><p>${none?"아직 모은 공시가 없어 판단을 내리지 않았어요. 호재나 악재로 판정된 공시가 들어오면 계산해요."
      :"최근 30일에 호재나 악재로 판정된 공시가 없어 판단을 내리지 않았어요. 판정된 공시가 들어오면 다시 계산해요."}</p>${failBox}</section>`;
  }
  const body = co.brief ? `<ul class="brief">${co.brief.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>` : `<p>${esc(co.lede)}</p>`;
  return `<section class="aicard" aria-label="AI 요약"><div class="${fail?"stale":""}">${AI}${body}</div>${failBox}<p class="foot meta">${NOTICE}</p></section>`;
}
/* ② 공시 타임라인: 최근 30일 호재·악재 공시. 줄 = 날짜 요일 · 호재/악재 / DART 공시 이름(원문 그대로). 누르면 패널에서 요약.
   중립 공시는 "전체 공시 보기"에서 */
function timeline(co){
  if(!co.events.length) return `<section class="card" aria-label="공시">${emptyBox("아직 모은 공시가 없어요","")}</section>`;
  const past = allEvents(co).filter(e=>dnum(ASOF)-dnum(e.d)<WINDOW && e.tone!=="flat");
  const newest = past[0], newKey = newest && dnum(ASOF)-dnum(newest.d)<=3 ? keyOf(newest) : null; /* 최근 3일 안의 가장 새 공시에 "새" */
  const plans = [...co.watch].sort((a,b)=>b[0].localeCompare(a[0])).map(([d,t])=>
    `<li class="plan"><span class="n" aria-hidden="true"></span><div class="t3"><span class="lab meta num"><b>${md(d)}</b>예정 · D-${dnum(d)-dnum(ASOF)}</span><span class="row-title">${esc(t)}</span></div></li>`).join("");
  const today = `<li class="today"><span class="n" aria-hidden="true"></span><div class="t3"><span class="lab meta num"><b>${md(ASOF)} ${wd(ASOF)}</b>오늘</span></div></li>`;
  const rows = past.map((e,i)=>{ const gap = Math.min(14, dnum(i ? past[i-1].d : ASOF) - dnum(e.d)) * 5;
    return `<li style="--gap:${gap}px"><span class="n ${e.tone} i${e.imp}" aria-hidden="true"></span><button type="button" class="t3 item" data-dv="${esc(keyOf(e))}"><span class="lab meta num"><b>${md(e.d)} ${wd(e.d)}</b><span class="tw ${e.tone}">${TONE[e.tone]}</span><span class="sr">영향 ${SIZE[e.imp]}</span></span><span class="row-title">${keyOf(e)===newKey?`<span class="new-tag">새</span>`:""}${esc(e.t)}</span></button></li>`; }).join("");
  return `<section class="card" aria-label="최근 30일 호재·악재 공시"><ol class="tl">${plans}${today}${rows}</ol>
    ${past.length ? "" : emptyBox("최근 30일 호재·악재 공시가 없어요","")}
    <div class="more"><button type="button" class="tbtn" data-all>전체 공시 보기${icon("next","sm")}</button></div></section>`;
}

/* ───────── 개요·재무 탭 (예시 수치) ─────────
   지금은 모든 회사에 같은 예시 수치를 쓴다. 칸마다 채울 데이터는 DART 기업개황·정기보고서·재무제표 API와 공공데이터 기업기본정보 */
const Q = ["24.4Q","25.1Q","25.2Q","25.3Q","25.4Q","26.1Q","26.2Q","26.3Q"];
const REV = [75.8,71.2,73.9,76.9,79.2,78.1,76.9,82.3], OP = [8.2,8.9,8.7,10.0,10.4,9.8,10.1,11.3], NI = [7.0,7.5,7.3,8.6,8.7,8.2,8.5,9.5];
const EQ = [380,384,388,392,398,402,410,418], DEBT = [104,104,101,106,111,108,110,110];
const r1 = v => Math.round(v*10)/10, rate = (a,b) => a.map((v,i)=>r1(v/b[i]*100));
const sec = (title, sub, body) => `<section class="card" aria-label="${title}">${title?`<div class="sec-h"><h2 class="card-title">${title}</h2>${sub}</div>`:""}${body}</section>`;
const blk = (title, sub, body) => `<div class="blk"><h3 class="blk-h">${title}<span class="meta">${sub}</span></h3>${body}</div>`;
const say = t => `<p class="say">${t}</p>`;
const strip = items => `<dl class="strip num">${items.map(([a,b])=>`<div><dt class="meta">${a}</dt><dd>${b}</dd></div>`).join("")}</dl>`;
const srcLine = t => `<p class="meta faint src">${t}</p>`;
const emptyBox = (title, desc, ic="") => `<div class="empty box">${ic?icon(ic):""}<div><p class="row-title">${title}</p>${desc?`<p class="meta">${desc}</p>`:""}</div></div>`;

function overviewTab(co){
  if(!co.hasFin) return sec("", "", emptyBox("아직 모은 개요가 없어요",""));
  const mix = [["가전·스마트폰·네트워크",54],["메모리·시스템 반도체",38],["디스플레이 패널",10],["전장·오디오",5],["부문 간 거래 제거",-7]], mx = Math.max(...mix.map(m=>m[1]));
  const mixBlk = blk("매출 구성", "2025년 사업보고서", `<ul class="mixbar num">${mix.map(([n,v])=>`<li><span>${n}</span>${v>0?`<i style="width:${(v/mx*100).toFixed(1)}%"></i>`:"<span></span>"}<b${v<0?' class="neg"':""}>${v}%</b></li>`).join("")}</ul>`);
  const holders = [["최대주주 쪽","20.1","20.1","--vz-blue"],["자기주식","2.4","1.6","--vz-orange"],["소액주주","66.0","66.8","--vz-teal"],["그 밖의 주주","11.5","11.5","--vz-rest"]];
  const holdBlk = blk("주주 구성", "2026년 반기보고서", say("최대주주 쪽 지분은 1년 동안 그대로이고, 회사가 가진 자기주식은 1.6%에서 2.4%로 늘었어요.")
    + `<div class="hbar" role="img" aria-label="주주 구성">${holders.map(h=>`<i style="width:${h[1]}%;background:var(${h[3]})"></i>`).join("")}</div>`
    + `<ul class="hleg num">${holders.map(h=>`<li><i style="background:var(${h[3]})"></i><span>${h[0]}</span><b>${h[1]}%</b><span class="meta">1년 전 ${h[2]}%</span></li>`).join("")}</ul>`);
  /* 주식 수 변화: 증자(감자) 현황 + 전환사채·신주인수권부사채 발행. 아직 주식으로 바뀌지 않은 사채는 "모두 바뀌면"으로 따로 센다 */
  const shareBlk = blk("주식 수 변화", "최근 3년", say("최근 3년 동안 유상증자나 전환사채 발행이 없어 주식 수가 그대로예요.")
    + strip([["지금 발행주식","59.7억 주"],["3년 전","59.7억 주"]]));
  /* 주의할 점: 문제가 없는 줄은 담담하게, 있는 줄만 악재 색 */
  const risk = [["감사의견","3년 연속 적정",0],["관리종목·투자주의","지정 없음",0],["불성실공시법인","지정 없음",0],["소송 제기","최근 1년 1건",1]];
  const riskBlk = blk("주의할 점", "최근 3년", say("감사의견은 3년 연속 적정이고 거래소 지정 이력은 없어요. 최근 1년 소송 제기 공시가 1건 있어요.")
    + `<ul class="chk">${risk.map(([a,b,bad])=>`<li${bad?' class="bad"':""}><span>${a}</span><b>${b}</b></li>`).join("")}</ul>`);
  return sec("", "", say("1969년에 세운 전자 회사로, 가전·스마트폰과 반도체를 함께 만들어요.")
    + strip([["업종","통신 및 방송 장비 제조업"],["대표이사","대표 2명"],["설립일","1969년 1월"],["결산월","12월"],["홈페이지",`<a class="extlink" href="#" onclick="return false">열기${icon("external","sm")}<span class="sr">(새 창)</span></a>`]])
    + mixBlk + holdBlk + shareBlk + riskBlk
    + srcLine("출처 DART 기업개황 · 사업보고서 · 최대주주 현황 · 소액주주 현황 · 증자(감자) 현황 · 감사의견 · 주요사항보고서 · 거래소 공시"));
}

let FST = "is"; /* 재무제표 표: 손익계산서 / 재무상태표 / 현금흐름표 */
function finTab(co){
  if(!co.hasFin) return sec("", "", emptyBox("아직 모은 실적이 없어요","분기보고서나 잠정실적 공시가 나오면 채워져요."));
  const n = Q.length, niR = rate(NI,REV), opR = rate(OP,REV), dR = rate(DEBT,EQ);
  const yoy = a => a.map((v,i)=> i>=4 ? r1((v/a[i-4]-1)*100) : null);
  const sgn = v => v==null ? "-" : `<span class="${toneOf(v)}">${v>0?"+":""}${v.toFixed(1)}%</span>`;
  const chg = a => { const v=(a[n-1]/a[n-5]-1)*100; return `${Math.abs(v).toFixed(0)}% ${v>=0?"늘었어요":"줄었어요"}`; };
  /* 막대 둘(같은 눈금) + 비율 선(오른쪽 눈금). 색은 지표마다 고정: 매출 파랑, 순이익 청록, 영업이익 호박, 총자본 보라, 총부채 주황, 비율 선 밝은 회색 */
  const combo = (A, B, R, nameA, nameB, nameR, ca, cb, unit="조 원") =>
    `<div class="cjw"><canvas data-cj="${esc(JSON.stringify({A,B,R,nameA,nameB,nameR,ca,cb,unit}))}" role="img" aria-label="최근 8개 분기 ${nameA}, ${nameB}, ${nameR}"></canvas></div>`
    + `<div class="leg meta"><span><i style="background:var(${ca})"></i>${nameA}</span><span><i style="background:var(${cb})"></i>${nameB}</span><span><i class="ln" style="background:var(--vz-line)"></i>${nameR}</span></div>`;
  const table = rows => `<div class="tbl"><table class="num"><thead><tr><th>분기</th>${Q.map(q=>`<th>${q}</th>`).join("")}</tr></thead><tbody>${rows.map(([name,cells])=>`<tr><th>${name}</th>${cells.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

    cf:[["영업활동 현금흐름",[15.2,12.8,14.1,17.3]],["투자활동 현금흐름",[-13.0,-11.5,-12.8,-14.2]],["재무활동 현금흐름",[-2.4,-3.1,-1.0,-2.6]]] };
  const fsTbl = `<div class="tbl"><table class="num"><thead><tr><th>조 원</th>${Q.slice(n-4).map(q=>`<th>${q}</th>`).join("")}</tr></thead><tbody>${fsRows[FST].map(([a,c])=>`<tr><th>${a}</th>${c.map(v=>`<td${v<0?' class="down"':""}>${v.toFixed(1)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  /* 실적 발표 기록: 분기마다 잠정실적 공시. 누르면 그 공시 패널 */
  const rel = [["26.3Q","2026-10-28"],["26.2Q","2026-07-31"],["26.1Q",null]].map(([q,d])=>{ const i=Q.indexOf(q), g=r1((OP[i]/OP[i-4]-1)*100), e=d&&co.events.find(x=>x.d===d);
    const body=`<span class="q">${q}</span><span class="meta">${d?md(d)+" 발표":"공시 없음"}</span><b>${jo(OP[i])}</b><span class="${toneOf(g)}">${g>0?"+":""}${g.toFixed(1)}%</span>`;
    return e ? `<li><button type="button" class="rel" data-dv="${esc(keyOf(e))}">${body}</button></li>` : `<li><div class="rel">${body}</div></li>`; }).join("");
  return sec("실적", `<span class="meta">잠정실적 공시 기준</span>`,
      strip([["최근 발표","10.28"],["발표 영업이익","11.3조 원"],["1년 전 대비",`<span class="up">+13.0%</span>`]])
      + blk("발표 기록", "분기 · 발표일 · 영업이익 · 1년 전 대비", `<ul class="rels">${rel}</ul>`)
      + srcLine("출처 DART"))
    + sec("재무", `<span class="meta">2026년 3분기 · 연결</span>`,
      strip([["부채비율",`${dR[n-1].toFixed(1)}%`],["유동비율","257.8%"],["이자보상비율","45.2배"]])

        + combo(REV, OP, opR, "매출액", "영업이익", "영업이익률", "--vz-blue", "--vz-amber")

        + combo(EQ, DEBT, dR, "총자본", "총부채", "부채비율", "--vz-violet", "--vz-orange")
        + table([["총자본",EQ.map(v=>v.toFixed(0))],["총부채",DEBT.map(v=>v.toFixed(0))],["부채비율",dR.map(v=>v.toFixed(1)+"%")]]))
      + blk("재무제표", "최근 4개 분기", `<div class="seg fs-seg" role="group" aria-label="재무제표">${[["is","손익계산서"],["bs","재무상태표"],["cf","현금흐름표"]].map(([k,l])=>`<button type="button" data-fst="${k}" aria-pressed="${FST===k}">${l}</button>`).join("")}</div>${fsTbl}`)

/* Chart.js: canvas는 CSS 변수를 못 읽어서 그릴 때 계산된 색을 넘긴다. 오른쪽 축 id를 r로 지으면 원형 축으로 읽혀 선이 안 그려진다(y2 + axis:"y") */
let CJ = [];
function initCharts(){
  CJ.forEach(c=>c.destroy()); CJ=[]; if(!window.Chart) return;
  const cs=getComputedStyle(document.documentElement), v=n=>cs.getPropertyValue(n).trim();
  Chart.defaults.font.family = v("--font"); Chart.defaults.font.size = 12;
  document.querySelectorAll("canvas[data-cj]").forEach(cv=>{ const d=JSON.parse(cv.dataset.cj);
    const ca=v(d.ca), cb=v(d.cb), cl=v("--vz-line"), grid=v("--line"), tick=v("--text-sub"), card=v("--card");
    CJ.push(new Chart(cv,{ data:{ labels:Q, datasets:[
        {type:"line",label:d.nameR,data:d.R,yAxisID:"y2",borderColor:cl,backgroundColor:cl,borderWidth:2,pointRadius:4,pointHoverRadius:5,pointBorderColor:card,pointBorderWidth:2,pointBackgroundColor:cl,order:0},
        {type:"bar",label:d.nameA,data:d.A,yAxisID:"y",backgroundColor:ca,borderRadius:3,maxBarThickness:16,categoryPercentage:.7,barPercentage:.9,order:1},
        {type:"bar",label:d.nameB,data:d.B,yAxisID:"y",backgroundColor:cb,borderRadius:3,maxBarThickness:16,categoryPercentage:.7,barPercentage:.9,order:1}]},
      options:{ responsive:true, maintainAspectRatio:false, animation:false, interaction:{mode:"index",intersect:false},
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:c=>` ${c.dataset.label} ${c.dataset.yAxisID==="y2" ? c.parsed.y+"%" : c.parsed.y+d.unit}` } } },
        scales:{ x:{grid:{display:false},border:{color:grid},ticks:{color:tick,maxRotation:0,autoSkip:true,maxTicksLimit:4}},
                 y:{beginAtZero:true,grid:{color:grid},border:{display:false},ticks:{color:tick,maxTicksLimit:3}},
                 y2:{axis:"y",position:"right",grid:{display:false},border:{display:false},ticks:{color:tick,maxTicksLimit:3,callback:x=>x+"%"}} } } })); });
}

/* 뉴스 탭: 제목·언론사·시각만(본문은 저장·표시하지 않는다). 판단 점수에 넣지 않는다. 누르면 패널 */
function newsTab(co){
  const l = mineNews(co), all = NEWS[state.code]||[];
  if(!l.length) return sec("뉴스", "", emptyBox("최근 뉴스가 없어요", ""));
  return sec("뉴스", "", `<ul class="news">${l.map(x=>`<li><a href="#" onclick="return false" data-dv="news:${all.indexOf(x)}"><span class="row-title">${esc(x[1])}</span><span class="meta faint num">${esc(x[2])} · ${esc(newsWhen(x))}</span></a></li>`).join("")}</ul>`);
}

/* ───────── 화면 상태 ───────── */
/* 불러오는 중: 실제 배치와 같은 자리에 회색 면 */
const sk = (w,h) => `<span class="sk" style="width:${w};height:${h}px"></span>`;
const gapY = h => `<div style="height:${h}"></div>`;
function skeleton(){
  const lines = n => Array.from({length:n},()=>`<div style="padding:var(--s3) 0">${sk("40%",14)}${gapY("var(--s2)")}${sk("75%",18)}</div>`).join("");
  return `<div class="co">${sk("200px",36)}${gapY("var(--s2)")}${sk("180px",16)}</div>
  <div aria-hidden="true">${sk("100%",48)}</div>
  <section class="card" aria-hidden="true">${sk("72px",18)}${gapY("var(--s3)")}${sk("100%",72)}${gapY("var(--s4)")}${sk("60%",14)}</section>
  <section class="card" aria-hidden="true">${lines(5)}</section>
  <p class="sr" role="status">회사 정보를 불러오는 중이에요</p>`;
}
/* 불러오기 오류: 원인과 다음 행동. 사과하지 않는다 */
const errorView = () => `<section class="card state-card" role="alert">
    <h2 class="card-title">회사 정보를 불러오지 못했어요</h2>
    <p class="meta">서버에 연결하지 못했어요. 잠시 뒤 다시 불러와 주세요. 공시 원문은 DART에서 바로 볼 수 있어요.</p>
    <div class="actions"><button type="button" class="btn primary" data-retry>${icon("reload")}다시 불러오기</button><a class="btn" href="${DART}" target="_blank" rel="noopener">DART에서 보기${icon("external")}<span class="sr">(새 창)</span></a></div>
  </section>`;

/* ───────── 그리기 ───────── */
function render(){
  const app = $("app");
  app.setAttribute("aria-busy", String(state.view==="loading"));
  if(state.view==="loading"){ app.innerHTML = skeleton(); return; }
  if(state.view==="error"){ app.innerHTML = errorView(); return; }
  const co = DB[state.code];
  if(state.page==="all"){ app.innerHTML = allView(co); return; }
  const body = state.tab==="overview" ? overviewTab(co) : state.tab==="fin" ? finTab(co) : state.tab==="news" ? newsTab(co) : aiCard(co) + timeline(co);
  app.innerHTML = `${head(co)}
  <div class="tabs" role="tablist" aria-label="회사 화면">${TABS.map(([k,l])=>`<button type="button" role="tab" id="tab-${k}" aria-controls="panel" aria-selected="${state.tab===k}" tabindex="${state.tab===k?0:-1}" data-tab="${k}">${l}</button>`).join("")}</div>
  <div id="panel" data-panel="${state.tab}" role="tabpanel" aria-labelledby="tab-${state.tab}">${body}</div>`;
  initCharts();
  document.querySelectorAll(".tbl").forEach(t=>{ t.scrollLeft=t.scrollWidth; });
  if(state.dv) markCurrent(state.dv);
}

/* 전체 공시 화면: 거르기(검색, 판정, 분류, 연도) + 20건씩 쪽 넘김. 모아 둔 2년보다 오래된 공시는 DART로 */
const APAGE = 20;
function allView(co){
  const all = allEvents(co), gs = [...new Set(all.map(e=>e.g))].sort(), ys = [...new Set(all.map(e=>e.d.slice(0,4)))].sort().reverse();
  const q = AF.q.trim().replace(/\s/g,"");
  const l = all.filter(e => (AF.tone==="all"||e.tone===AF.tone) && (AF.g==="all"||e.g===AF.g) && (AF.y==="all"||e.d.startsWith(AF.y))
    && (!q || (e.r+e.t).replace(/\s/g,"").includes(q)));
  const pages = Math.max(1, Math.ceil(l.length/APAGE)); AF.p = Math.min(AF.p, pages);
  const shown = l.slice((AF.p-1)*APAGE, AF.p*APAGE);
  let lastY = null;
  const rows = shown.map(e=>{ const y=e.d.slice(0,4), h = y!==lastY ? `${lastY?"</ul>":""}<h2 class="box-title ayear">${y}년</h2><ul class="alist num">` : ""; lastY=y;
    return h+`<li><button type="button" class="arow" data-dv="${esc(keyOf(e))}"><span class="d meta">${md(e.d)}</span><span class="row-title">${esc(e.t)}</span><span class="meta"><span class="tw ${e.tone}">${TONE[e.tone]}</span> · ${esc(e.g)}</span></button></li>`; }).join("") + (lastY?"</ul>":"");
  const pg = (n,label=n,dis=false) => `<button type="button" data-page="${n}" ${n===AF.p&&label===n?'aria-current="page"':""} ${dis?"disabled":""}>${label}</button>`;
  const win = []; for(let i=Math.max(1,AF.p-2); i<=Math.min(pages,AF.p+2); i++) win.push(i);
  const pager = pages>1 ? `<nav class="pager num" aria-label="쪽">${pg(AF.p-1,"이전",AF.p===1)}${win[0]>1?pg(1)+(win[0]>2?"<span class='meta'>…</span>":""):""}${win.map(n=>pg(n)).join("")}${win[win.length-1]<pages?(win[win.length-1]<pages-1?"<span class='meta'>…</span>":"")+pg(pages):""}${pg(AF.p+1,"다음",AF.p===pages)}</nav>` : "";
  const seg = opts => `<div class="seg" role="group" aria-label="판정">${opts.map(([v,t])=>`<button type="button" data-af-tone="${v}" aria-pressed="${AF.tone===v}">${t}</button>`).join("")}</div>`;
  return `
  <div class="co"><button type="button" class="tbtn back" data-back>${icon("prev","sm")}${esc(co.name)}</button><h1>전체 공시</h1></div>
  <section class="card" aria-label="전체 공시">
    <div class="af">
      <div class="search field"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input id="aq" type="search" placeholder="공시 이름으로 찾기" value="${esc(AF.q)}" aria-label="공시 이름으로 찾기" autocomplete="off"></div>
      <div class="af-row">${seg([["all","전체"],["up","호재"],["down","악재"],["flat","중립"]])}
        <select data-af="g" aria-label="분류"><option value="all">분류 전체</option>${gs.map(g=>`<option value="${esc(g)}" ${AF.g===g?"selected":""}>${esc(g)}</option>`).join("")}</select>
        <select data-af="y" aria-label="연도"><option value="all">모든 연도</option>${ys.map(y=>`<option value="${y}" ${AF.y===y?"selected":""}>${y}년</option>`).join("")}</select></div>
    </div>
    <p class="meta acount num">${l.length.toLocaleString("ko-KR")}건</p>
    ${l.length ? rows : emptyBox("맞는 공시가 없어요","")}
    ${pager}
    <div class="adart"><a class="tbtn" href="${DART}" target="_blank" rel="noopener">2024년 11월 이전 공시는 DART에서${icon("external","sm")}<span class="sr">(새 창)</span></a></div>
  </section>`;
}

/* ───────── 패널 ───────── */
/* 패널에 열린 줄을 선택 상태로 표시 */
const markCurrent = key => document.querySelectorAll("#app [data-dv]").forEach(b=>{ if(key && b.dataset.dv===key) b.setAttribute("aria-current","true"); else b.removeAttribute("aria-current"); });
function fillDrawer(key){
  const co = DB[state.code];
  $("drawer-co").textContent = co.name;
  if(key.startsWith("news:")){ const all = NEWS[state.code]||[], i = +key.slice(5), mine = mineNews(co), j = mine.indexOf(all[i]);
    $("drawer-b").innerHTML = newsHTML(all[i]);
    const older = mine[j+1] ? "news:"+all.indexOf(mine[j+1]) : "", newer = j>0 ? "news:"+all.indexOf(mine[j-1]) : "";
    $("drawer-f").innerHTML = `<button type="button" class="tbtn" data-step="${older}" ${older?"":"disabled"}>${icon("prev","sm")}이전 뉴스</button><button type="button" class="tbtn" data-step="${newer}" ${newer?"":"disabled"}>다음 뉴스${icon("next","sm")}</button>`; }
  else { $("drawer-b").innerHTML = dvHTML(co, findEv(co,key)); $("drawer-f").innerHTML = navBtns(co,key); }
  $("drawer-b").scrollTop = 0;
  markCurrent(key);
}
function openDrawer(key, from){
  const co = DB[state.code];
  if(key.startsWith("news:") ? !(NEWS[state.code]||[])[+key.slice(5)] : !findEv(co,key)) return;
  const wasOpen = !!state.dv; state.dv = key; if(from) opener = from;
  fillDrawer(key);
  const d=$("drawer"), s=$("scrim");
  if(!wasOpen){ d.hidden=false; s.hidden=false; setInert(true);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ d.classList.add("on"); s.classList.add("on"); })); }
  d.querySelector("[data-close]").focus({preventScroll:true}); }
const setInert = on => ["header","#app","footer"].forEach(sel=>{ document.querySelector(sel).inert=on; });
function closeDrawer(){ if(!state.dv) return; state.dv=null;
  const d=$("drawer"), s=$("scrim"); d.classList.remove("on"); s.classList.remove("on"); setInert(false);
  setTimeout(()=>{ if(!state.dv){ d.hidden=true; s.hidden=true; } }, 220);
  markCurrent(null);
  if(opener && document.contains(opener)) opener.focus({preventScroll:true}); }
/* 주소: 패널을 열면 공시 주소(#d=…)가 붙고, 뒤로 가기로 닫힌다. 패널 안의 이전·다음은 기록을 쌓지 않는다 */
function go(key, how){ const url = "#d="+encodeURIComponent(key);
  try{ if(how==="replace") history.replaceState({key},"",url); else history.pushState({key},"",url); }catch(_){ /* 주소를 바꿀 수 없는 미리보기 */ } }
window.addEventListener("popstate",ev=>{ const key = ev.state && ev.state.key; if(key) openDrawer(key); else closeDrawer();
  const pg = ev.state && ev.state.page==="all" ? "all" : (key && state.page==="all" ? "all" : "co"); if(pg!==state.page){ state.page=pg; render(); } });
function dismiss(){ if(history.state && history.state.key){ history.back(); return; } closeDrawer(); }
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape" && state.dv){ ev.preventDefault(); dismiss(); } });

/* ───────── 데모 화면 상태 ───────── */
const demoKey = () => state.code==="000000" ? "empty" : state.view;
const markDemo = () => document.querySelectorAll("[data-demo]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.demo===demoKey())));
let loadTimer = null;
function setView(view, code){ clearTimeout(loadTimer); if(code) state.code=code; state.view=view; render(); markDemo(); }
/* 불러오기: 자리 표시를 잠깐 보여준 뒤 정상 화면으로. 다시 불러온 AI 요약 카드는 1.2초 밝혔다가 원래대로 */
function load(code, flash){ setView("loading", code);
  loadTimer = setTimeout(()=>{ setView("ok"); if(flash){ const j=document.querySelector(".aicard,.co"); if(j) j.classList.add("is-new"); } }, 700); }
function setDemo(k){
  const real = state.code==="000000" ? lastCode : state.code;
  if(k==="empty") setView("ok","000000"); else setView(k, real);
  if(k!=="ok") window.scrollTo({top:0,behavior:"smooth"}); }

/* ───────── 입력 ───────── */
document.addEventListener("change",ev=>{ const k=ev.target.dataset&&ev.target.dataset.af; if(!k) return; AF[k]=ev.target.value; AF.p=1; render(); });
document.addEventListener("input",ev=>{ if(ev.target.id!=="aq") return; AF.q=ev.target.value; AF.p=1; const pos=ev.target.selectionStart; render(); const i=$("aq"); i.focus(); i.setSelectionRange(pos,pos); });
function selectTab(k, focus){ state.tab=k; render();
  const tabs=document.querySelector(".tabs"), stuck=tabs.getBoundingClientRect().bottom, panelTop=$("panel").getBoundingClientRect().top;
  if(panelTop < stuck + 24) window.scrollBy({top: panelTop - stuck - 24}); /* 탭이 위에 붙어 있었으면 새 탭의 처음이 탭 바로 아래에 보이게 */
  if(focus) $("tab-"+k).focus({preventScroll:true}); }
document.addEventListener("click",ev=>{
  if(ev.target.id==="scrim"){ dismiss(); return; }
  const tb=ev.target.closest("button[data-tab]"); if(tb){ selectTab(tb.dataset.tab, true); return; }
  if(ev.target.closest("[data-all]")){ state.page="all"; AF={tone:"all",g:"all",y:"all",q:"",p:1}; history.pushState({page:"all"},"","#all"); render(); window.scrollTo(0,0); return; }
  if(ev.target.closest("[data-back]")){ if(history.state&&history.state.page==="all") history.back(); else { state.page="co"; render(); } return; }
  const at=ev.target.closest("[data-af-tone]"); if(at){ AF.tone=at.dataset.afTone; AF.p=1; render(); return; }
  const ap=ev.target.closest("[data-page]"); if(ap){ AF.p=+ap.dataset.page; render(); document.querySelector('[aria-label="전체 공시"]').scrollIntoView({block:"start"}); scrollBy(0,-80); return; }
  const fs=ev.target.closest("[data-fst]"); if(fs){ FST=fs.dataset.fst; render(); return; }
  const t=ev.target.closest("[data-retry],[data-demo],[data-dv],[data-step],[data-close]"); if(!t) return;
  const d=t.dataset;
  if(d.dv!=null){ go(d.dv, state.dv?"replace":"push"); openDrawer(d.dv, t); return; }
  if(d.step!=null){ if(!d.step) return; go(d.step,"replace"); openDrawer(d.step); return; }
  if("close" in d){ dismiss(); return; }
  if(d.demo){ setDemo(d.demo); return; }
  if("retry" in d){ load(null, true); return; }
});
/* 탭: 좌우 방향키로 옮긴다 */
document.addEventListener("keydown",ev=>{ const tb=ev.target.closest&&ev.target.closest("[role=tab]"); if(!tb||(ev.key!=="ArrowLeft"&&ev.key!=="ArrowRight")) return; ev.preventDefault();
  const ks=TABS.map(t=>t[0]), i=ks.indexOf(state.tab); selectTab(ks[(i+(ev.key==="ArrowRight"?1:ks.length-1))%ks.length], true); });
const setAb=()=>document.documentElement.style.setProperty("--ab", document.querySelector(".appbar").offsetHeight+"px"); setAb(); window.addEventListener("resize",setAb);

/* 검색 자동완성. 맞는 회사가 없으면 왜 없는지와 어떻게 찾는지 */
const q=$("q"), sug=$("sug"); let hi=-1;
const matches = v => { v=v.trim().toLowerCase(); return v? CODES.filter(c=>c.includes(v)||DB[c].name.toLowerCase().includes(v)) : CODES; };
function showSug(){ const m=matches(q.value); hi=-1;
  sug.innerHTML = m.length ? m.map(c=>`<button type="button" data-c="${c}"><span>${DB[c].name}</span><span class="meta faint num">${c} · ${DB[c].market}</span></button>`).join("")
    : `<div class="empty" role="status">${icon("search")}<div><p class="row-title">‘${esc(q.value.trim())}’에 맞는 회사가 없어요</p><p class="meta">회사 이름이나 6자리 종목코드로 찾아 보세요. 데모에는 ${CODES.map(c=>DB[c].name).join(", ")}만 있어요.</p></div></div>`;
  sug.hidden=false; }
function pick(c){ if(!c) return; lastCode=c;
  AF={tone:"all",g:"all",y:"all",q:"",p:1}; state={page:"co",tab:"disc",code:c,view:"ok",dv:null}; FST="is"; q.value=DB[c].name; sug.hidden=true;
  load(c); window.scrollTo({top:0,behavior:"smooth"}); }
q.addEventListener("input",showSug); q.addEventListener("focus",showSug);
q.addEventListener("keydown",e=>{ const bs=[...sug.querySelectorAll("button")];
  if(e.key==="ArrowDown") hi=Math.min(bs.length-1,hi+1); else if(e.key==="ArrowUp") hi=Math.max(0,hi-1);
  else if(e.key==="Enter"){ e.preventDefault(); pick(hi>=0&&bs[hi]?bs[hi].dataset.c:matches(q.value)[0]); return; }
  else if(e.key==="Escape"){ sug.hidden=true; return; } else return;
  bs.forEach((b,i)=>b.classList.toggle("on",i===hi)); e.preventDefault(); });
sug.addEventListener("mousedown",e=>{ const b=e.target.closest("button"); if(b) pick(b.dataset.c); });
document.addEventListener("click",e=>{ if(!e.target.closest(".search")) sug.hidden=true; });

render();
</script>
