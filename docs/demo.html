<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기업 인사이트 데모</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 종목 화면 데모. ① 판단 카드(판단, 근거 3개, 반대로 볼 점, 고지) ② 판단 추이 ③ 실적(접힘) ④ 타임라인(일정 → 오늘 → 지난 공시).
   ⑤ 공시 한 건: 판단 근거, 그래프의 날짜 목록, 타임라인 어디서 눌러도 같은 오른쪽 패널(좁은 화면은 아래 시트)이 열린다.
   ⑥ 화면 상태: 불러오는 중(자리 표시), 분석 실패, 불러오기 오류, 공시 없는 회사, 검색 결과 없음. 화면 아래 "데모 화면 상태"로 바꿔 본다.
   규칙은 DESIGN.md, 부품과 상태 전체는 design-system.html.
   색·간격·모서리·글자 크기는 모두 아래 토큰으로만 쓴다(라이트 모드는 토큰 블록을 하나 더해 붙인다). */
:root{
  /* 회색 단계표: 같은 계열(살짝 차가운 회색). 숫자가 작을수록 밝다 */
  --g200:#e4e4e7; --g300:#d4d4d8; --g400:#a1a1aa; --g450:#93939c; --g600:#52525b; --g700:#3f3f46; --g800:#27272a; --g900:#18181b; --g925:#111113; --g950:#09090b;
  --bg:var(--g950); /* 거의 검정. 순수 검정(#000) 위 순수 흰색은 글자가 번져 보여 둘 다 한 단계씩 낮춘다 */
  --card:var(--g925); /* 카드, 판단 카드 */
  --surface:var(--g900); /* 카드 안의 한 단계 들어간 칸, 입력창 */
  --glass-solid:rgba(9,9,11,.8); --glass-blur:24px; /* 위에 떠 있는 유리(상단 바, 패널): --g950을 80%로 */
  --text:var(--g200); --text-sub:var(--g400); --text-faint:var(--g450);
  --tint:255,255,255;
  --line:var(--g800); --line-hover:var(--g700); --line-selected:var(--g600); --line-strong:var(--g700);
  /* 면의 상태: hover는 지금 면보다 한 단계, 누름·선택은 두 단계 밝게 */
  --fill-hover:var(--g900); --fill-selected:var(--g800); /* 카드 위의 줄·글자형 버튼(기본 면 없음) */
  --btn:var(--g900); --btn-hover:var(--g800); --btn-press:var(--g700); /* 보조 버튼·세그먼트(기본 면 900) */
  --primary:var(--g200); --primary-hover:var(--g300); --primary-press:var(--g400); --on-primary:var(--g950); /* 주 버튼(밝은 면) */
  --focus:rgba(var(--tint),.6);
  --up:#ff5c69; --up-soft:rgba(255,92,105,.12); --up-line:rgba(255,92,105,.45); --down:#4c94ff; --down-soft:rgba(76,148,255,.12); --down-line:rgba(76,148,255,.45); --flat:var(--g400); --flat-soft:var(--g800);
  --ai:#a78bfa; --ai-soft:rgba(167,139,250,.12); --ai-wash:rgba(167,139,250,.06); --ai-line:rgba(167,139,250,.32); --ai-glow:rgba(167,139,250,.18);
  --scrim:rgba(0,0,0,.55);
  /* 간격: 4px 단계 일곱 개만 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px;
  /* 모서리: 세 가지만. 큰 면(카드·패널) / 안쪽 것(칸·버튼·입력창·줄·목록) / 알약(칩·배지·세그먼트) */
  --r-lg:16px; --r-md:12px; --r-full:999px;
  /* 글자 크기: 다섯 개 + 좁은 화면의 화면 제목 24 */
  --fs-title:28px; --fs-value:20px; --fs-card:17px; --fs-body:15px; --fs-small:13px;
  --fast:.2s cubic-bezier(.4,0,.2,1);
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs-body);font-weight:400;line-height:1.6;letter-spacing:-.01em;margin:0;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere} /* 한글은 단어 중간에서 줄을 바꾸지 않는다 */
h1,h2,h3,p{margin:0} h1,h2{text-wrap:balance}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
:is(a,button,input,[tabindex]):focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gutter{padding-left:max(var(--s4),env(safe-area-inset-left,0px));padding-right:max(var(--s4),env(safe-area-inset-right,0px))}
.inner{max-width:720px;margin:0 auto}

/* ───────── 글자 역할: 이 여덟 가지만 쓴다 ───────── */
/* 화면 제목 28/800 (폭 600px 이하 24) */
h1{font-size:var(--fs-title);font-weight:800;line-height:1.3;letter-spacing:-.03em}
/* 큰 값 20/800: 판단 배지, 패널 제목, 실적 숫자 */
.badge,.dv-title,.fin dd{font-size:var(--fs-value);font-weight:800;line-height:1.3;letter-spacing:-.02em}
/* 카드 제목 17/700: 판단 카드를 포함한 모든 카드 제목, 로고 글자, 상태 안내의 제목 */
.card-title,.logo{font-size:var(--fs-card);font-weight:700;line-height:1.4;letter-spacing:-.02em}
/* 줄 제목 15/600: 목록 한 줄의 쉬운 말, 버튼 글자, 날짜 목록의 머리 */
.row-title,.btn{font-size:var(--fs-body);font-weight:600;line-height:1.5}
/* 본문 15/400: 문단, 요약 (body 기본값) */
/* 칸 제목 13/700 보조색: 판단 근거, 반대로 볼 점, 패널 안 칸의 제목, 타임라인 묶음 이름 */
.box-title{font-size:var(--fs-small);font-weight:700;line-height:1.5;color:var(--text-sub);letter-spacing:0}
/* 라벨 13/600: 칩, AI 칩, 세그먼트 버튼, 글자형 버튼 */
.chip,.tone,.ai,.seg button,.tbtn{font-size:var(--fs-small);font-weight:600;line-height:1.5;letter-spacing:0}
/* 메타 13/400: 날짜·출처·원문 제목(옅은 색), 설명·고지(보조색) */
.meta{font-size:var(--fs-small);font-weight:400;line-height:1.5;color:var(--text-sub);letter-spacing:0}
.meta.faint{color:var(--text-faint)}

/* ───────── 아이콘: 24 칸에 그린 선 아이콘, 선 굵기는 크기와 상관없이 1.5px ───────── */
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.i *{vector-effect:non-scaling-stroke}
.i.sm{width:16px;height:16px}
/* 모양 기호(호재 ▲, 악재 ▼, 중립 —): 채운 도형. 색만으로 구분하지 않으려고 붙인다 */
.shape{width:12px;height:12px;flex:none;fill:currentColor;stroke:none}
.badge .shape{width:16px;height:16px}

/* ───────── 부품 ───────── */
/* 버튼: 주(밝은 면, 화면에 하나), 보조(회색 면 + 테두리), 글자형(면 없음), 아이콘(44px 정사각) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:44px;padding:0 var(--s4);border-radius:var(--r-md);border:1px solid var(--line-hover);background:var(--btn);color:var(--text);text-decoration:none;transition:border-color var(--fast),background var(--fast),color var(--fast)}
.btn:hover{background:var(--btn-hover);border-color:var(--line-selected)}
.btn:active{background:var(--btn-press)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.primary:active{background:var(--primary-press);border-color:var(--primary-press)}
.btn.icon{min-width:44px;padding:0;border-color:transparent;background:none}
.btn.icon:hover{background:var(--fill-hover)} .btn.icon:active{background:var(--fill-selected)}
.tbtn{display:inline-flex;align-items:center;gap:var(--s1);text-decoration:none;min-height:44px;padding:0 var(--s2);margin:0 calc(-1 * var(--s2));border-radius:var(--r-md);color:var(--text-sub);transition:color var(--fast),background var(--fast)}
.tbtn:hover{color:var(--text);background:var(--fill-hover)}
.tbtn:active{background:var(--fill-selected)}
:is(.btn,.tbtn,.seg button):disabled{opacity:.4;cursor:default;pointer-events:none}
/* 세그먼트(같은 내용을 다른 범위로 보는 선택만): 선택은 밝은 면 */
.seg{display:inline-flex;gap:var(--s2);flex-wrap:wrap}
.seg button{min-height:36px;padding:0 var(--s4);border-radius:var(--r-full);border:1px solid var(--line-hover);background:var(--btn);color:var(--text-sub);transition:border-color var(--fast),background var(--fast),color var(--fast)}
.seg button:hover{border-color:var(--line-selected);background:var(--btn-hover);color:var(--text)}
.seg button:active{background:var(--btn-press);color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:700}
/* 칩(누를 수 없는 표시): 호재·악재·중립과 AI. 면은 불투명 카드색 위에 겹친 옅은 색으로 고정한다(선택된 줄 위에서도 대비가 같게) */
.tone,.ai,.chip{display:inline-flex;align-items:center;gap:var(--s1);height:24px;padding:0 var(--s2);border-radius:var(--r-full);white-space:nowrap}
.tone.up{background:linear-gradient(var(--up-soft),var(--up-soft)),var(--card);color:var(--up)}
.tone.down{background:linear-gradient(var(--down-soft),var(--down-soft)),var(--card);color:var(--down)}
.tone.flat{background:linear-gradient(var(--flat-soft),var(--flat-soft)),var(--card);color:var(--text-sub)}
.ai{color:var(--ai);background:linear-gradient(var(--ai-soft),var(--ai-soft)),var(--card);box-shadow:0 0 0 1px var(--ai-line),0 0 14px var(--ai-glow);vertical-align:1px;margin-right:var(--s2)}
.chip{color:var(--text-sub);border:1px solid var(--line-hover)}
.by-ai{color:var(--ai)}
/* 판단 배지: 옅은 색 면 + 가는 색 테두리, 강한 호재·악재만 색으로 채운다 */
.badge{display:inline-flex;align-items:center;gap:var(--s2);border-radius:var(--r-full);padding:var(--s2) var(--s4);border:1px solid}
.badge.up{color:var(--up);background:linear-gradient(var(--up-soft),var(--up-soft)),var(--card);border-color:var(--up-line)}
.badge.down{color:var(--down);background:linear-gradient(var(--down-soft),var(--down-soft)),var(--card);border-color:var(--down-line)}
.badge.up.strong{background:var(--up);border-color:var(--up);color:var(--bg)}
.badge.down.strong{background:var(--down);border-color:var(--down);color:var(--bg)}
.badge.flat{color:var(--text-sub);background:linear-gradient(var(--flat-soft),var(--flat-soft)),var(--card);border-color:var(--line-hover)}
.badge.hold{color:var(--text-sub);border-color:var(--line-selected);border-style:dashed}
/* 입력창 */
.field{position:relative}
.field .i{position:absolute;left:var(--s3);top:50%;margin-top:-10px;color:var(--text-faint);pointer-events:none}
.field input{width:100%;height:44px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);color:var(--text);padding:0 var(--s3) 0 40px;font:inherit;font-size:var(--fs-body);transition:border-color var(--fast)}
.field input::placeholder{color:var(--text-faint)}
.field input:hover{border-color:var(--line-hover)}
.field input:focus{border-color:var(--line-selected)}
.field input:disabled{opacity:.4;cursor:default}
/* 목록 한 줄(누르면 패널이 열림): 기본 면 없음 → hover 900 → 누름·선택 800 */
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s1) var(--s3);align-items:start;padding:var(--s3);margin:0 calc(-1 * var(--s3));width:calc(100% + var(--s6));border-radius:var(--r-md);transition:background var(--fast)}
.row:hover{background:var(--fill-hover)}
.row:active,.row[aria-current="true"]{background:var(--fill-selected)}
.row .go{color:var(--text-faint);margin-top:calc((1.5em - 16px) / 2)}
.row .meta{grid-column:2/4}
/* 카드: 한 색의 면(925) + 가는 회색 테두리(800). 누를 수 없어서 hover가 없다 */
.card,.judge{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s6);min-width:0}
/* 카드 안의 칸(반대로 볼 점, 날짜 목록, 실적 칸, 패널의 칸, 빈 상태) */
.box{background:var(--surface);border-radius:var(--r-md);padding:var(--s4)}
/* AI가 쓴 글(판단 카드의 한 줄 요약, 패널의 3줄 요약)은 옅은 보라 테두리 칸에 넣는다. 보라는 AI 전용 */
.ai-box{background:linear-gradient(var(--ai-wash),var(--ai-wash)),var(--card);border:1px solid var(--ai-line);border-radius:var(--r-md);padding:var(--s4)}
/* 빈 상태·검색 결과 없음: 왜 없는지(줄 제목)와 언제 생기는지(메타) */
.empty{display:flex;gap:var(--s3);align-items:flex-start}
.empty>.i{color:var(--text-faint);margin-top:calc((1.5em - 20px) / 2)}
.empty .meta{margin-top:var(--s1)}
/* 불러오는 중: 실제 배치와 같은 자리에 회색 면(900)을 둔다. 느리게 한 번씩 옅어진다 */
.sk{display:block;background:var(--surface);border-radius:var(--r-md);animation:pulse 1.6s cubic-bezier(.4,0,.2,1) infinite}
.sk.pill{border-radius:var(--r-full)}
@keyframes pulse{50%{opacity:.5}}

/* ───────── 상단 바: 위에 떠 있는 유리 ───────── */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:1px solid var(--line);
  background:var(--glass-solid);-webkit-backdrop-filter:blur(var(--glass-blur));backdrop-filter:blur(var(--glass-blur))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.appbar .inner{display:flex;align-items:center;gap:var(--s3);padding-block:var(--s3)}
.logo{display:flex;align-items:center;gap:var(--s2);white-space:nowrap}
/* 로고: 둥근 칸을 밝은 면으로 채우고 겹친 층 아이콘을 바탕색으로 */
.logo .mark{width:32px;height:32px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--text);color:var(--bg)}
.logo .mark svg{width:18px;height:18px}
.search{flex:1;min-width:0;max-width:420px;position:relative}
.sug{position:absolute;left:0;right:0;top:calc(100% + var(--s1));background:var(--card);border:1px solid var(--line-hover);border-radius:var(--r-md);overflow:hidden;z-index:30}
.sug button{display:flex;justify-content:space-between;gap:var(--s3);width:100%;min-height:44px;align-items:center;padding:var(--s2) var(--s3);transition:background var(--fast)}
.sug button:hover,.sug button.on{background:var(--fill-hover)}
.sug .empty{padding:var(--s3)}

/* ───────── 종목 화면 ───────── */
main.inner{display:grid;gap:var(--s6);padding-block:var(--s8) var(--s12)}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);flex-wrap:wrap}
.co .meta{margin-top:var(--s1)}

/* ① 판단 카드: 화면에서 유일하게 2px 테두리 */
.judge{border-width:2px;border-color:var(--line-strong);border-top-color:var(--line-selected)}
.judge.hold{border-style:dashed}
.jh{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s1) var(--s2);flex-wrap:wrap}
.vrow{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s4)}
.barrow{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s4)}
.bar{flex:1;position:relative;height:8px;border-radius:var(--r-full);background:var(--flat-soft);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:var(--r-full)}
.bar .fill.up{background:var(--up)} .bar .fill.down{background:var(--down)} .bar .fill.flat{background:var(--flat)}
.bar .mid{left:50%;width:2px;background:var(--card);margin-left:-1px;border-radius:0}
.lede{margin-top:var(--s4)}
.stale{opacity:.6} /* 분석 실패 때 지난 판단 */
.fail{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s4);padding:var(--s3) var(--s4);border:1px solid var(--line-hover);border-radius:var(--r-md)}
.box-title.basis{margin:var(--s6) 0 var(--s1)}
.ev{list-style:none;margin:0;padding:0}
.ev li{border-top:1px solid var(--line)}
.ev li:first-child{border-top:0}
.counter{margin-top:var(--s4)}
.counter .box-title{margin-bottom:var(--s1)}
.counter .tbtn{margin-top:var(--s1)}
.how{margin-top:var(--s2)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:var(--s1) var(--s3);flex-wrap:wrap;margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--line)}
.chev{transition:transform var(--fast)}
[aria-expanded="true"] .chev{transform:rotate(180deg)}

/* ② 판단 추이 */
.sec-h + .meta{margin-top:var(--s1)}
.chart-box{position:relative;margin-top:var(--s3)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font);font-size:var(--fs-small);fill:var(--text-faint)}
.chart .cross{stroke:var(--text-faint);stroke-dasharray:3 3;display:none}
.chart .hdot{fill:var(--text);stroke:var(--card);stroke-width:2;display:none}
.tip{position:absolute;pointer-events:none;display:none;background:var(--text);color:var(--bg);border-radius:var(--r-md);padding:var(--s1) var(--s3);font-size:var(--fs-small);font-weight:600;white-space:nowrap;transform:translate(-50%,-125%)}
.day{margin-top:var(--s3);padding:var(--s3) var(--s4)}
.day .h{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);flex-wrap:wrap}
.day ul{list-style:none;margin:var(--s2) 0 0;padding:0}
.day li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 var(--s2);padding:var(--s2) 0;border-top:1px solid var(--line);align-items:start}
.day li:first-child{border-top:0}
.day li .meta{grid-column:2}
.day .t{text-align:left;text-decoration:none}

function bizDays(endIso,n){ const out=[]; const d=new Date(endIso+"T00:00:00Z");
  while(out.length<n){ const w=d.getUTCDay(); if(w!==0&&w!==6) out.unshift(d.toISOString().slice(0,10)); d.setUTCDate(d.getUTCDate()-1);} return out; }

const bday = iso => DATES[bdx(iso)];
const dnum = iso => Math.round(Date.parse(iso+"T00:00:00Z")/86400000);

/* ───────── 판단 (코드가 계산) ─────────
   최근 30일 공시의 크기 합: (호재 합 − 악재 합) ÷ (호재 합 + 악재 합 + 5)
   +5는 공시가 적을 때 극단값이 나오지 않게 하는 완충값.
   호재·악재로 판정된 공시가 하나도 없으면 "판단 보류"(가정: 중립과 구분하려는 것) */
const WINDOW = 30, DAMP = 5;
function scoreAt(co, iso){
  const t = dnum(iso); let U=0, D=0; const list=[];
  for(const e of co.events){ const k=t-dnum(e.d); if(k>=0 && k<WINDOW){ list.push(e); if(e.tone==="up") U+=e.imp; else if(e.tone==="down") D+=e.imp; } }
  return { s:(U-D)/(U+D+DAMP), U, D, list, hold: U+D===0 };
}

function dayEvents(co){ const m={}; co.events.forEach(e=>{ const k=bday(e.d); (m[k]=m[k]||[]).push(e); }); return m; }

/* 위: 판단 선 / 아래: 일별 공시 막대(호재는 위, 악재는 아래, 높이는 크기 합) */
function chart(co){
  const n = periodOf(state.period)[2], from = LAST-n;
  const SC = DATES.slice(from).map(d=>scoreAt(co,d)), S = SC.map(c=>c.s), HOLD = SC.map(c=>c.hold);
  const W=680,H=270,L=4,R=44,T=12,PB=158,ST=176,B=26, SB=H-B, ym=(ST+SB)/2;
  const cw = (W-L-R)/n;
  const x = i => L+cw*(i-from), y = v => T+(PB-T)*(1-(v+1)/2), y0 = y(0), yU = y(BAND), yD = y(-BAND);
  const P = S.map((v,j)=>`${x(from+j).toFixed(1)},${y(v).toFixed(1)}`), pts = P.join(" ");
  const area = `${x(from).toFixed(1)},${y0} ${pts} ${x(LAST).toFixed(1)},${y0}`;
  /* 선을 판단이 있는 구간과 판단 보류 구간(양 끝 날이 모두 보류)으로 나눈다. 보류 구간은 회색 점선 */
  const runs = []; for(let j=1;j<P.length;j++){ const hold = HOLD[j-1] && HOLD[j], last = runs[runs.length-1];
    if(last && last.hold===hold) last.p.push(P[j]); else runs.push({hold, p:[P[j-1],P[j]]}); }
  const line = (stroke,clip) => runs.filter(r=>!r.hold).map(r=>`<polyline points="${r.p.join(" ")}" fill="none" stroke="var(${stroke})" stroke-width="2" stroke-linejoin="round" clip-path="url(#${clip})"/>`).join("");
  const holdLines = runs.filter(r=>r.hold).map(r=>`<polyline points="${r.p.join(" ")}" fill="none" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="3 4"/>`).join("");
  /* 격자 점선 없이: 중립 구간(판단 단계 경계 ±BAND)만 옅은 띠로, 이름표는 호재·중립·악재 셋 */
  const grid = `<rect x="${L}" y="${yU}" width="${W-R-L}" height="${yD-yU}" fill="var(--fill-hover)"/>
    <line x1="${L}" x2="${W-R}" y1="${y0}" y2="${y0}" stroke="var(--line-hover)"/>
    <text x="${W-R+8}" y="${y(0.6)+4}">호재</text><text x="${W-R+8}" y="${y0+4}">중립</text><text x="${W-R+8}" y="${y(-0.6)+4}">악재</text>`;
  const byDay = dayEvents(co);
  const sums = i => { let u=0,d=0,f=0; (byDay[DATES[i]]||[]).forEach(e=>{ if(e.tone==="up") u+=e.imp; else if(e.tone==="down") d+=e.imp; else f++; }); return {u,d,f}; };
  let mx = 3; for(let i=from;i<=LAST;i++){ const s=sums(i); mx=Math.max(mx,s.u,s.d); }
  const k = (ym-ST-2)/mx, bw = Math.max(2, Math.min(10, cw*0.75));
  let bars = "";
  for(let i=from;i<=LAST;i++){ const {u,d,f}=sums(i), bx=(x(i)-bw/2).toFixed(1);
    if(u) bars += `<rect x="${bx}" y="${(ym-u*k).toFixed(1)}" width="${bw.toFixed(1)}" height="${(u*k).toFixed(1)}" rx="1" fill="var(--up)"/>`;
    if(d) bars += `<rect x="${bx}" y="${ym}" width="${bw.toFixed(1)}" height="${(d*k).toFixed(1)}" rx="1" fill="var(--down)"/>`;
    if(!u && !d && f) bars += `<rect x="${bx}" y="${ym-2}" width="${bw.toFixed(1)}" height="4" rx="1" fill="var(--flat)" opacity=".6"/>`; }
  const si = state.sel && IDX[state.sel]!=null && IDX[state.sel]>=from ? IDX[state.sel] : null, hw = Math.max(cw, 8);
  const selMark = si==null ? "" : `<rect x="${(x(si)-hw/2).toFixed(1)}" y="${T}" width="${hw.toFixed(1)}" height="${SB-T}" fill="var(--fill-selected)"/>
    <line x1="${x(si)}" x2="${x(si)}" y1="${T}" y2="${SB}" stroke="var(--text)" stroke-width="1"/><circle cx="${x(si)}" cy="${y(S[si-from])}" r="5" fill="var(--text)" stroke="var(--card)" stroke-width="2"/>`;
  const mid = from+Math.round(n/2);
  G = { from, n, L, W, H, T, PB, SB, cw, S, byDay };
  return `<div class="chart-box"><svg class="chart" id="svg" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="${co.name} ${periodOf(state.period)[1]} 판단 추이와 일별 공시. 좌우 방향키로 날짜를 옮길 수 있어요">

    ${grid}
    <polygon points="${area}" fill="var(--up-soft)" clip-path="url(#cu)"/><polygon points="${area}" fill="var(--down-soft)" clip-path="url(#cd)"/>
    ${line("--up","cu")}${line("--down","cd")}${line("--flat","cf")}${holdLines}
    <line x1="${L}" x2="${W-R}" y1="${ym}" y2="${ym}" stroke="var(--line)"/>
    <text x="${W-R+8}" y="${ym+4}">공시</text>
    ${bars}
    ${selMark}
    <line class="cross" id="cx" y1="${T}" y2="${SB}"/><circle class="hdot" id="hdot" r="4.5"/>
    <rect x="${L}" y="0" width="${W-L-R+cw}" height="${SB}" fill="transparent" style="cursor:pointer"/>
    <text x="${x(from)}" y="${H-6}">${md(DATES[from])}</text><text x="${x(mid)}" y="${H-6}" text-anchor="middle">${md(DATES[mid])}</text><text x="${x(LAST)}" y="${H-6}" text-anchor="end">${md(DATES[LAST])}</text>
  </svg><div class="tip" id="tip"></div></div>`;
}

/* ───────── 공시 한 건 (오른쪽 패널) ─────────
   판단 근거, 그래프의 날짜 목록, 타임라인 어디서 눌러도 같은 패널이 열린다. 내용은 dvHTML 하나.
   공시마다 주소(#d=…)를 붙여 공유와 뒤로 가기가 된다. 실제 화면에서는 DART 접수번호를 쓴다. */
const keyOf = e => e.d+"|"+e.t+"|"+e.r;
const findEv = (co,key) => co.events.find(e=>keyOf(e)===key);
const sorted = co => [...co.events].sort((a,b)=>b.d.localeCompare(a.d));
const BY_HOW = {"제목 규칙":"제목만으로 판정하는 공시 유형이라 본문을 읽지 않았어요.","본문 숫자":"본문 표의 숫자를 코드가 읽어 판정했어요.","AI":"본문의 글을 AI가 읽고 판정했어요."};
const ymd = iso => iso.replaceAll("-",".");

function dvHTML(co, e){
  const age = dnum(ASOF)-dnum(e.d);
  const inJudge = e.tone==="flat" ? "중립이라 판단 계산에 넣지 않았어요."
    : age<WINDOW ? "최근 30일 공시라 지금 판단에 들어가 있어요." : "30일이 지나 지금 판단에는 들어가지 않아요.";
  const sum = e.s
    ? `<div class="ai-box">${AI}<ul>${e.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p class="meta faint">요약의 금액·비율·날짜는 코드가 원문과 맞는지 확인했어요.</p></div>`
    : `<div class="box"><h3 class="box-title">요약</h3><p class="meta">${e.tone==="flat"?"중립 공시는 요약하지 않아요. 제목과 원문으로 확인해 주세요.":"요약을 아직 만들지 않았어요. 다음 분석 때 채워져요."}</p></div>`;
  const how = `<div class="box"><h3 class="box-title">어떻게 판정했나요</h3><p>${e.by==="AI"?`<span class="by-ai">AI</span> · `:""}${BY_HOW[e.by]}</p></div>`;
  return `<div class="dv">
    <div class="dv-verdict meta num"><span class="tone ${e.tone}">${SHAPE[e.tone]}${TONE[e.tone]}</span>${e.imp?`<span>크기 ${SIZE[e.imp]}</span>`:""}<span>${ymd(e.d)} · ${e.g}</span></div>
    <h2 class="dv-title" id="dv-title">${esc(e.r)}</h2>
    <p class="meta">DART 공시 제목 · ${esc(e.t)}</p>
    <p class="dv-in meta faint">${inJudge}</p>
    ${sum}${how}
    <a class="btn primary dv-src" href="${DART}" target="_blank" rel="noopener">DART에서 원문 보기${icon("external")}<span class="sr">(새 창)</span></a>
    <p class="notice meta">AI 요약은 틀릴 수 있으며 투자 권유가 아니에요.</p></div>`;
}

/* 이전·다음 공시 (날짜순, 이전 = 더 오래된 공시) */
function neighbors(co,key){ const l=sorted(co), i=l.findIndex(e=>keyOf(e)===key); return { older:l[i+1]||null, newer:l[i-1]||null }; }
const navBtns = (co,key) => { const {older,newer}=neighbors(co,key);
  return `<button type="button" class="tbtn num" data-step="${older?esc(keyOf(older)):""}" ${older?"":"disabled"}>${icon("prev","sm")}이전 공시${older?" "+md(older.d):""}</button><button type="button" class="tbtn num" data-step="${newer?esc(keyOf(newer)):""}" ${newer?"":"disabled"}>다음 공시${newer?" "+md(newer.d):""}${icon("open","sm")}</button>`; };

/* 판단 근거 한 줄 = 공시 한 건 */
const evRow = e => `<li><button type="button" class="row" data-dv="${esc(keyOf(e))}">
    <span class="tone ${e.tone}">${SHAPE[e.tone]}<span class="tw">${TONE[e.tone]}</span></span><span class="row-title">${esc(e.r)}</span>${icon("open","sm go")}
    <span class="meta faint num">${md(e.d)} · ${esc(e.t)}${e.by==="AI"?` · <span class="by-ai">AI 판정</span>`:""}</span></button></li>`;

function judgeCard(co){
  const fail = state.view==="fail";
  const day = fail ? DATES[LAST-1] : ASOF;
  const now = scoreAt(co, day), recent = now.list;
  const dir = recent.filter(e=>e.tone!=="flat"), nUp = dir.filter(e=>e.tone==="up").length, nDn = dir.length-nUp;
  const head = `<div class="jh"><h2 class="card-title">최근 공시 기준 판단</h2><span class="meta num">${md(day)} 기준 · 최근 30일 공시</span></div>`;
  const failBox = fail ? `<div class="fail meta"><span>${md(ASOF)} 공시 분석이 끝나지 않아 ${md(day)} 판단을 보여주고 있어요. 새 공시는 다음 분석 때 반영돼요.</span><button type="button" class="btn" data-retry>${icon("reload")}다시 불러오기</button></div>` : "";
  const foot = `<div class="foot"><p class="notice meta">AI 요약은 틀릴 수 있으며 투자 권유가 아니에요.</p>
      <button type="button" class="tbtn" data-toggle="how" aria-expanded="${state.how}">계산 방식${CHEV}</button></div>
    ${state.how?`<p class="how meta">공시마다 호재·악재와 크기를 정하고(제목 규칙, 본문 숫자, 나머지는 AI), 판단은 최근 30일 공시의 크기를 더해 코드가 계산해요. 같은 공시면 언제 계산해도 같은 결과가 나와요. 공시마다 DART 원문으로 확인할 수 있어요.</p>`:""}`;

  if(now.hold){
    const none = !co.events.length;
    return `<section class="judge hold" aria-label="판단">${head}
      <div class="vrow"><span class="badge hold">판단 보류</span><span class="meta num">${none?"모은 공시 0건":`최근 30일 공시 ${recent.length}건 · 모두 중립`}</span></div>
      <p class="lede">${none?"아직 모은 공시가 없어 판단을 내리지 않았어요. 호재나 악재로 판정된 공시가 들어오면 계산해요."
        :"최근 30일에 호재나 악재로 판정된 공시가 없어 판단을 내리지 않았어요. 판정된 공시가 들어오면 다시 계산해요."}</p>
      ${recent.length?`<h3 class="box-title basis">최근 30일 공시</h3><ul class="ev">${recent.map(evRow).join("")}</ul>`:""}
      ${failBox}${foot}</section>`;
  }

  const [vText,vCls,strong] = verdictOf(now.s);
  const fillL = now.s>=0 ? 50 : 50+now.s*50, fillW = Math.abs(now.s)*50;
  const byImp = (a,b)=> b.imp-a.imp || b.d.localeCompare(a.d);
  const pos = dir.filter(e=>e.tone==="up").sort(byImp), neg = dir.filter(e=>e.tone==="down").sort(byImp);
  const main = vCls==="up" ? pos : vCls==="down" ? neg : [...dir].sort(byImp);
  const top = main.slice(0,3), rest = dir.filter(e=>!top.includes(e)).sort(byImp);
  const opp = vCls==="up" ? neg[0] : vCls==="down" ? pos[0] : null;
  const counter = vCls==="flat"
    ? `<div class="counter box"><h3 class="box-title">반대로 볼 수 있는 점</h3><p>호재 ${nUp}건(크기 합 ${now.U})과 악재 ${nDn}건(크기 합 ${now.D})이 비슷하게 맞서 있어요. 새 공시 한 건으로 판단이 바뀔 수 있어요.</p></div>`
    : opp ? `<div class="counter box"><h3 class="box-title">반대로 볼 수 있는 점</h3><p>${esc(opp.r)}</p><button type="button" class="tbtn num" data-dv="${esc(keyOf(opp))}">${TONE[opp.tone]} · ${esc(opp.t)} · ${md(opp.d)}${icon("open","sm")}</button></div>`
    : `<div class="counter box"><h3 class="box-title">반대로 볼 수 있는 점</h3><p>최근 30일에 ${vCls==="up"?"악재":"호재"}로 판정된 공시는 없었어요.</p></div>`;

  return `<section class="judge" aria-label="판단">${head}
    <div class="${fail?"stale":""}">
      <div class="vrow"><span class="badge ${vCls}${strong?" strong":""}">${SHAPE[vCls]}${vText}</span>
        <span class="meta num">근거 공시 ${dir.length}건 · 호재 ${nUp} · 악재 ${nDn}</span></div>
      <div class="barrow meta faint"><span aria-hidden="true">악재</span><div class="bar" role="img" aria-label="호재·악재 정도: ${vText}. 가운데가 중립"><i class="fill ${vCls}" style="left:${fillL}%;width:${fillW}%"></i><i class="mid"></i></div><span aria-hidden="true">호재</span></div>
      <p class="lede ai-box">${AI}${esc(co.lede)}</p>
    </div>
    ${failBox}
    <h3 class="box-title basis">판단 근거</h3>
    <ul class="ev">${top.map(evRow).join("")}</ul>
    ${rest.length?`<button type="button" class="tbtn" data-toggle="all" aria-expanded="${state.all}">${state.all?"근거 접기":`나머지 근거 ${rest.length}건 보기`}${CHEV}</button>
      ${state.all?`<ul class="ev">${rest.map(evRow).join("")}</ul>`:""}`:""}
    ${counter}
    ${foot}</section>`;
}

/* 빈 상태: 왜 없는지와 언제 생기는지 */
const emptyBox = (title, desc, ic="") => `<div class="empty box">${ic?icon(ic):""}<div><p class="row-title">${title}</p><p class="meta">${desc}</p></div></div>`;

/* 불러오는 중: 실제 배치와 같은 자리에 회색 면 */
const sk = (w,h,cls="") => `<span class="sk${cls?" "+cls:""}" style="width:${w};height:${h}px"></span>`;
function skeleton(){
  const lines = n => Array.from({length:n},(_,i)=>`<div style="padding:var(--s3) 0;border-top:${i?"1px solid var(--line)":"0"}">${sk("80%",18)}<div style="height:var(--s2)"></div>${sk("55%",14)}</div>`).join("");
  return `<div class="co">${sk("180px",36)}<div style="height:var(--s2)"></div>${sk("200px",16)}</div>
  <section class="judge" aria-hidden="true">${sk("160px",22)}<div style="height:var(--s4)"></div>${sk("140px",44,"pill")}<div style="height:var(--s4)"></div>${sk("100%",8,"pill")}<div style="height:var(--s4)"></div>${sk("100%",72)}<div style="height:var(--s6)"></div>${lines(3)}</section>
  <section class="card" aria-hidden="true">${sk("96px",22)}<div style="height:var(--s4)"></div>${sk("100%",200)}</section>
  <section class="card" aria-hidden="true">${sk("64px",22)}</section>
  <section class="card" aria-hidden="true">${sk("96px",22)}<div style="height:var(--s3)"></div>${lines(4)}</section>
  <p class="sr" role="status">회사 정보를 불러오는 중이에요</p>`;
}

/* 불러오기 오류: 원인과 다음 행동. 사과하지 않는다 */
const errorView = () => `<section class="card state-card" role="alert">
    <h2 class="card-title">회사 정보를 불러오지 못했어요</h2>
    <p class="meta">서버에 연결하지 못했어요. 잠시 뒤 다시 불러와 주세요. 공시 원문은 DART에서 바로 볼 수 있어요.</p>
    <div class="actions"><button type="button" class="btn primary" data-retry>${icon("reload")}다시 불러오기</button><a class="btn" href="${DART}" target="_blank" rel="noopener">DART에서 보기${icon("external")}<span class="sr">(새 창)</span></a></div>
  </section>`;

function fillDrawer(co,e){ const key=keyOf(e);
  $("drawer-co").textContent = `${co.name} · 공시 한 건`;
  $("drawer-b").innerHTML = dvHTML(co,e); $("drawer-b").scrollTop = 0;
  $("drawer-f").innerHTML = navBtns(co,key);
  markCurrent(key); }
/* 패널에 열린 공시의 줄을 선택 상태로 표시 */
const markCurrent = key => document.querySelectorAll("#app [data-dv]").forEach(b=>{ if(key && b.dataset.dv===key) b.setAttribute("aria-current","true"); else b.removeAttribute("aria-current"); });
function openDrawer(key, from){
  const co=DB[state.code], e=findEv(co,key); if(!e) return;
  const wasOpen = !!state.dv; state.dv=key; if(from) opener=from;
  fillDrawer(co,e);
  const d=$("drawer"), s=$("scrim");
  if(!wasOpen){ d.hidden=false; s.hidden=false; setInert(true);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ d.classList.add("on"); s.classList.add("on"); })); }
  d.querySelector("[data-close]").focus({preventScroll:true}); }
const setInert = on => ["header","#app","footer"].forEach(sel=>{ document.querySelector(sel).inert=on; });
function closeDrawer(){ if(!state.dv) return; state.dv=null;
  const d=$("drawer"), s=$("scrim"); d.classList.remove("on"); s.classList.remove("on"); setInert(false);
  setTimeout(()=>{ if(!state.dv){ d.hidden=true; s.hidden=true; } }, 220);
  markCurrent(null);
  if(opener && document.contains(opener)) opener.focus({preventScroll:true}); }

/* 주소: 패널을 열면 공시 주소(#d=…)가 붙고, 뒤로 가기로 닫힌다 */
function go(key, how){ const url = "#d="+encodeURIComponent(key);
  try{ if(how==="replace") history.replaceState({key},"",url); else history.pushState({key},"",url); }catch(_){ /* 주소를 바꿀 수 없는 미리보기 */ } }
window.addEventListener("popstate",ev=>{ const key = ev.state && ev.state.key; if(key) openDrawer(key); else closeDrawer(); });

function render(){
  const app = $("app");
  app.setAttribute("aria-busy", String(state.view==="loading"));
  if(state.view==="loading"){ app.innerHTML = skeleton(); G=null; return; }
  if(state.view==="error"){ app.innerHTML = errorView(); G=null; return; }
  const co = DB[state.code], none = !co.events.length;
  const now = scoreAt(co, ASOF), [vText,vCls] = now.hold ? ["판단 보류","flat"] : verdictOf(now.s);
  const [pKey,pLabel,n] = periodOf(state.period), from = LAST-n;
  const s0 = scoreAt(co, DATES[from]), v0 = s0.hold ? "판단 보류" : verdictOf(s0.s)[0];
  let selList = null, selHead = "", selMove = "", navPrev = null, navNext = null;
  if(!none && state.sel && IDX[state.sel]!=null && IDX[state.sel]>=from){
    const a = state.sel, i = IDX[a], sc = scoreAt(co,a), sv = sc.s, dlt = sv - scoreAt(co,DATES[Math.max(0,i-1)]).s;
    const [svT,svC] = sc.hold ? ["판단 보류","flat"] : verdictOf(sv);
    selList = co.events.filter(e=>bday(e.d)===a);
    selHead = `${md(a)} · <span class="${svC}">${svT}</span>`;
    selMove = !selList.length ? `<span>이날 공시 없음</span>` : Math.abs(dlt)<0.01 ? `<span>공시 ${selList.length}건 · 판단 변화 없음</span>`
      : `<span>공시 ${selList.length}건 · <span class="${dlt>0?"up":"down"}">판단이 ${dlt>0?"호재":"악재"} 쪽으로 움직임</span></span>`;
    const evDays = [...new Set(co.events.map(e=>bday(e.d)))].filter(d=>IDX[d]>=from).sort();
    navPrev = evDays.filter(d=>d<a).pop() || null; navNext = evDays.find(d=>d>a) || null; }

  const past = [...co.events].sort((a,b)=>b.d.localeCompare(a.d));
  const shownPast = state.more ? past : past.slice(0,PAGE);
  const plans = [...co.watch].sort((a,b)=>b[0].localeCompare(a[0]));

  const trend = none
    ? emptyBox("그릴 판단이 아직 없어요", "공시가 들어오면 날마다 판단이 쌓여 그래프가 그려져요.")
    : `<p class="meta">${pLabel} 전 <b>${v0}</b> → 지금 <b class="${vCls}">${vText}</b></p>
    ${chart(co)}
    ${selList ? `<div class="day box num"><div class="h meta"><b class="row-title" style="color:var(--text)">${selHead}</b>${selMove}</div>
        ${selList.length ? `<ul>${selList.map(e=>`<li><span class="tone ${e.tone}">${SHAPE[e.tone]}${TONE[e.tone]}</span><button type="button" class="t row-title" data-dv="${esc(keyOf(e))}">${esc(e.r)}</button><span class="meta faint">${e.d!==state.sel?md(e.d)+"(주말) · ":""}${esc(e.t)}</span></li>`).join("")}</ul>`
          : `<p class="meta" style="padding:var(--s2) 0">이날 들어온 공시는 없어요. 판단은 최근 30일 공시로 계산돼요.</p>`}
        <div class="nav"><button type="button" class="tbtn" data-go="${navPrev||""}" ${navPrev?"":"disabled"}>${icon("prev","sm")}이전 공시${navPrev?" "+md(navPrev):""}</button><button type="button" class="tbtn" data-go="${navNext||""}" ${navNext?"":"disabled"}>다음 공시${navNext?" "+md(navNext):""}${icon("open","sm")}</button></div></div>`
      : `<p class="meta faint">그래프를 누르면 그날의 판단과 공시가 보여요. 점선은 호재·악재 공시가 없어 판단을 보류한 기간이에요. 아래 막대는 그날 들어온 호재·악재 공시이고, 길수록 크기가 커요.</p>`}`;

  let finCard;
  if(!co.fin){
    finCard = `<section class="card" aria-label="실적"><h2 class="card-title">실적</h2>
      ${emptyBox("아직 모은 실적이 없어요", "분기보고서나 잠정실적 공시가 나오면 채워져요.")}</section>`;
  } else {
    const f = co.fin, rg = f.rev[0]/f.rev[1]-1, og = f.op[0]/f.op[1]-1, ng = f.ni[0]/f.ni[1]-1;
    const mg0 = f.op[0]/f.rev[0]*100, mg1 = f.op[1]/f.rev[1]*100, mgd = Math.round(mg0*10)/10 - Math.round(mg1*10)/10;
    finCard = `<section class="card" aria-label="실적">
    <button type="button" class="disc" data-toggle="fin" aria-expanded="${state.fin}"><h2 class="card-title">실적</h2>
      <span class="sum meta num"><span class="v">영업이익 <b class="${toneOf(og)}">${pct(og)}</b></span>${CHEV}</span></button>
    ${state.fin ? `<dl class="fin num">
        <div class="box"><dt class="meta">매출액</dt><dd>${won(f.rev[0])}<small class="${toneOf(rg)}">1년 전보다 ${pct(rg)}</small></dd></div>
        <div class="box"><dt class="meta">영업이익</dt><dd>${won(f.op[0])}<small class="${toneOf(og)}">1년 전보다 ${pct(og)}</small></dd></div>
        <div class="box"><dt class="meta">영업이익률</dt><dd>${mg0.toFixed(1)}%<small class="${toneOf(mgd)}">${mgd>0?"+":""}${mgd.toFixed(1)}%p</small></dd></div>
        <div class="box"><dt class="meta">순이익</dt><dd>${won(f.ni[0])}<small class="${toneOf(ng)}">1년 전보다 ${pct(ng)}</small></dd></div></dl>
      <p class="meta faint">2026년 3분기 누적 · 연결 기준 · 출처 DART</p>` : ""}
  </section>`;
  }

  app.innerHTML = `
  <div class="co"><h1>${co.name}</h1><div class="meta num">${state.code} · ${co.market} · ${co.sector}</div></div>

  ${judgeCard(co)}

  <section class="card" aria-label="판단 추이">
    <div class="sec-h"><h2 class="card-title">판단 추이</h2>
      <div class="seg" role="group" aria-label="기간">${PERIODS.map(([k,l])=>`<button type="button" data-period="${k}" aria-pressed="${k===pKey}" ${none?"disabled":""}>${l}</button>`).join("")}</div></div>
    ${trend}
  </section>

  ${finCard}

  <section class="card" aria-label="타임라인">
    <h2 class="card-title">타임라인</h2>
    <ul class="tl num">
      ${plans.length?`<li><span></span><span></span><span class="lbl box-title">다가오는 일정 ${plans.length}건</span></li>`:""}
      ${plans.map(([d,t,s])=>`<li class="plan-row"><span class="d meta faint">${md(d)}</span><span class="n plan"></span><span class="static"><span class="row-title">${t}</span><span class="meta faint">${s} · 예정</span></span></li>`).join("")}
      <li class="today-row"><span class="d meta">${md(ASOF)}</span><span class="n today"></span><span class="static"><span class="row-title">오늘 · <span class="${vCls}">${vText}</span></span><span class="meta faint">최근 공시 기준 판단</span></span></li>
      ${shownPast.map(e=>`<li><span class="d meta faint">${md(e.d)}</span><span class="n ${e.tone}" aria-hidden="true">${e.tone==="flat"?"":SHAPE[e.tone]}</span><div>
          <button type="button" class="item" data-dv="${esc(keyOf(e))}"><span class="row-title"><span class="sr">${TONE[e.tone]}: </span>${esc(e.r)}</span>${icon("open","sm go")}<span class="meta faint">${esc(e.t)}${e.by==="AI"?` · <span class="by-ai">AI 판정</span>`:""}</span></button>
        </div></li>`).join("")}
      ${none?`<li><span></span><span></span><div class="tl-empty">${emptyBox("아직 모은 공시가 없어요","새 공시가 들어오면 여기에 날짜순으로 쌓여요. 수집은 5분마다 해요.")}</div></li>`:""}
    </ul>
    ${past.length>PAGE ? `<div class="more"><button type="button" class="tbtn" data-more aria-expanded="${state.more}">${state.more?"접기":`지난 공시 ${past.length-PAGE}건 더 보기`}${CHEV}</button></div>` : ""}
  </section>`;
  if(!none) bindHover(co); else G=null;
}

/* 호버: 가장 가까운 날로 맞춤 / 클릭: 그날 선택 / 좌우 방향키: 하루씩 이동 */
function bindHover(co){
  const svg=$("svg"), tip=$("tip"), cx=$("cx"), hd=$("hdot"); if(!svg||!G) return;
  const {from,n,L,W,H,T,PB,cw,S,byDay} = G;
  const x = i => L+cw*(i-from), y = v => T+(PB-T)*(1-(v+1)/2);
  const idxAt = ev => { const r=svg.getBoundingClientRect(), px=(ev.clientX-r.left)/r.width*W; return Math.max(from,Math.min(LAST,from+Math.round((px-L)/cw))); };
  const show = ev => { const i=idxAt(ev), v=S[i-from], X=x(i), Y=y(v), k=(byDay[DATES[i]]||[]).length;
    cx.setAttribute("x1",X); cx.setAttribute("x2",X); cx.style.display="block"; hd.setAttribute("cx",X); hd.setAttribute("cy",Y); hd.style.display="block";
    tip.style.display="block"; tip.style.left=(X/W*100)+"%"; tip.style.top=(Y/H*100)+"%";
    const sc=scoreAt(co,DATES[i]); tip.textContent=`${md(DATES[i])} · ${sc.hold?"판단 보류":verdictOf(v)[0]}${k?` · 공시 ${k}건`:""}`; };
  const hide = () => { cx.style.display="none"; hd.style.display="none"; tip.style.display="none"; };
  const pickDay = i => { state.sel = DATES[i]; render(); const s=$("svg"); if(s) s.focus({preventScroll:true}); };
  svg.addEventListener("mousemove",show); svg.addEventListener("mouseleave",hide);
  svg.addEventListener("touchmove",e=>show(e.touches[0]),{passive:true}); svg.addEventListener("touchend",hide);
  svg.addEventListener("click",ev=>{ const i=idxAt(ev); if(state.sel===DATES[i]){ state.sel=null; render(); } else pickDay(i); });
  svg.addEventListener("keydown",ev=>{ if(ev.key!=="ArrowLeft" && ev.key!=="ArrowRight") return; ev.preventDefault();
    const cur = state.sel && IDX[state.sel]>=from ? IDX[state.sel] : LAST+ (ev.key==="ArrowLeft"?1:0);
    pickDay(Math.max(from,Math.min(LAST,cur+(ev.key==="ArrowRight"?1:-1)))); });
}

/* 닫기: 공시 주소가 붙어 있으면 뒤로 가기와 같게 처리한다 */
function dismiss(){ if(history.state && history.state.key){ history.back(); return; } closeDrawer(); }
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape" && state.dv){ ev.preventDefault(); dismiss(); } });

/* 데모 화면 상태: 지금 보이는 상태를 아래 버튼에 표시 */
const demoKey = () => state.code==="000000" ? "empty" : state.view;
const markDemo = () => document.querySelectorAll("[data-demo]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.demo===demoKey())));
let loadTimer = null;
function setView(view, code){ clearTimeout(loadTimer); if(code){ state.code=code; state.sel=null; } state.view=view; render(); markDemo(); }
/* 불러오기: 자리 표시를 잠깐 보여준 뒤 정상 화면으로. 다시 불러온 판단 카드는 1.2초 밝혔다가 원래대로 */
function load(code, flash){ setView("loading", code);
  loadTimer = setTimeout(()=>{ setView("ok"); if(flash){ const j=document.querySelector(".judge"); if(j) j.classList.add("is-new"); } }, 700); }
function setDemo(k){
  const real = state.code==="000000" ? lastCode : state.code;
  if(k==="empty") setView("ok","000000");
  else setView(k, real);
  if(k!=="ok") window.scrollTo({top:0,behavior:"smooth"}); }

document.addEventListener("click",ev=>{
  if(ev.target.id==="scrim"){ dismiss(); return; }
  const t=ev.target.closest("[data-period],[data-go],[data-toggle],[data-more],[data-retry],[data-demo],[data-dv],[data-step],[data-close]"); if(!t) return;
  const d=t.dataset;
  if(d.dv!=null){ go(d.dv, state.dv?"replace":"push"); openDrawer(d.dv, t); return; }
  if(d.step!=null){ if(!d.step) return; go(d.step,"replace"); openDrawer(d.step); return; }
  if("close" in d){ dismiss(); return; }
  if(d.demo){ setDemo(d.demo); return; }
  if("retry" in d){ load(null, true); return; }
  if(d.period){ state.period=d.period; if(state.sel && IDX[state.sel] < LAST-periodOf(d.period)[2]) state.sel=null; }
  else if(d.go!=null){ if(!d.go) return; state.sel=d.go; }
  else if(d.toggle) state[d.toggle]=!state[d.toggle];
  else if("more" in d) state.more=!state.more;
  render();
});

/* 검색 자동완성. 맞는 회사가 없으면 왜 없는지와 어떻게 찾는지 */
const q=$("q"), sug=$("sug"); let hi=-1;
const matches = v => { v=v.trim().toLowerCase(); return v? CODES.filter(c=>c.includes(v)||DB[c].name.toLowerCase().includes(v)) : CODES; };
function showSug(){ const m=matches(q.value); hi=-1;
  sug.innerHTML = m.length ? m.map(c=>`<button type="button" data-c="${c}"><span>${DB[c].name}</span><span class="meta faint num">${c} · ${DB[c].market}</span></button>`).join("")
    : `<div class="empty" role="status">${icon("search")}<div><p class="row-title">‘${esc(q.value.trim())}’에 맞는 회사가 없어요</p><p class="meta">회사 이름이나 6자리 종목코드로 찾아 보세요. 데모에는 ${CODES.map(c=>DB[c].name).join(", ")}만 있어요.</p></div></div>`;
  sug.hidden=false; }
function pick(c){ if(!c) return; lastCode=c;
  state={code:c,period:"3m",sel:null,all:false,fin:false,more:false,how:false,view:"ok",dv:null}; q.value=DB[c].name; sug.hidden=true;
  load(c); window.scrollTo({top:0,behavior:"smooth"}); }
q.addEventListener("input",showSug); q.addEventListener("focus",showSug);
q.addEventListener("keydown",e=>{ const bs=[...sug.querySelectorAll("button")];
  if(e.key==="ArrowDown") hi=Math.min(bs.length-1,hi+1); else if(e.key==="ArrowUp") hi=Math.max(0,hi-1);
  else if(e.key==="Enter"){ e.preventDefault(); pick(hi>=0&&bs[hi]?bs[hi].dataset.c:matches(q.value)[0]); return; }
  else if(e.key==="Escape"){ sug.hidden=true; return; } else return;
  bs.forEach((b,i)=>b.classList.toggle("on",i===hi)); e.preventDefault(); });
sug.addEventListener("mousedown",e=>{ const b=e.target.closest("button"); if(b) pick(b.dataset.c); });
document.addEventListener("click",e=>{ if(!e.target.closest(".search")) sug.hidden=true; });

render();
</script>
