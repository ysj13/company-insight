<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기업 인사이트 데모</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 종목 화면 데모. ① 판단 카드(판단, 근거 3개, 반대로 볼 점, 고지) ② 판단 추이 ③ 실적(접힘) ④ 타임라인(일정 → 오늘 → 지난 공시).
   ⑤ 공시 한 건: 판단 근거, 그래프의 날짜 목록, 타임라인 어디서 눌러도 같은 오른쪽 패널(좁은 화면은 아래 시트)이 열린다.
   분위기: 다크, 테크, AI, 모던, 심플, 가독성, 글래스모피즘. 색은 무채색만 쓰고, 뜻이 있는 색은 호재·악재·AI 셋뿐이다.
   검정·회색은 아래 회색 단계표(한 계열) 중 하나만 쓴다. 면은 바탕 950 → 카드 925 → 안쪽 칸·버튼 900 → 선택 800으로 한 단계씩 밝아진다.
   바탕은 한 색이다(빛·무늬 없음). 유리는 위에 떠 있는 상단 바와 공시 패널에만 쓴다.
   색은 모두 아래 토큰으로만 쓴다(라이트 모드는 토큰 블록을 하나 더해 붙인다). */
:root{
  /* 회색 단계표: 같은 계열(살짝 차가운 회색). 숫자가 작을수록 밝다 */
  --g200:#e4e4e7; --g400:#a1a1aa; --g450:#93939c; --g600:#52525b; --g700:#3f3f46; --g800:#27272a; --g900:#18181b; --g925:#111113; --g950:#09090b;
  --bg:var(--g950); /* 거의 검정. 순수 검정(#000) 위 순수 흰색은 글자가 번져 보여 둘 다 한 단계씩 낮춘다 */
  --card:var(--g925); /* 카드, 판단 카드 */
  --surface:var(--g900); /* 카드 안의 한 단계 들어간 칸, 입력창 */
  --btn:var(--g900); /* 버튼·세그먼트의 바탕 */
  --glass-solid:rgba(9,9,11,.8); --glass-blur:24px; /* 위에 떠 있는 유리(상단 바, 패널): --g950을 80%로 */
  --text:var(--g200); --text-sub:var(--g400); --text-faint:var(--g450);
  --tint:255,255,255;
  --line:var(--g800); --line-hover:var(--g700); --line-selected:var(--g600); --line-strong:var(--g700);
  --fill-hover:var(--g900); --fill-selected:var(--g800); --focus:rgba(var(--tint),.6);
  --up:#ff5c69; --up-soft:rgba(255,92,105,.12); --up-line:rgba(255,92,105,.45); --down:#4c94ff; --down-soft:rgba(76,148,255,.12); --down-line:rgba(76,148,255,.45); --flat:var(--g400); --flat-soft:var(--g800);
  --ai:#a78bfa; --ai-soft:rgba(167,139,250,.12); --ai-wash:rgba(167,139,250,.06); --ai-line:rgba(167,139,250,.32);
  --scrim:rgba(0,0,0,.55);
  --radius:16px; --radius-sm:10px; --radius-pill:999px; --fast:.2s cubic-bezier(.4,0,.2,1);
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;letter-spacing:-.01em;margin:0;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere} /* 한글은 단어 중간에서 줄을 바꾸지 않는다 */
h1,h2,h3,p{margin:0} h1,h2{text-wrap:balance}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
:is(a,button,input,[tabindex]):focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:720px;margin:0 auto}

/* 상단 바: 위에 떠 있는 유리. 뒤로 지나가는 글자가 비치지 않게 짙게 */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:1px solid var(--line);
  background:var(--glass-solid);-webkit-backdrop-filter:blur(var(--glass-blur));backdrop-filter:blur(var(--glass-blur))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.appbar .inner{display:flex;align-items:center;gap:14px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
/* 로고: 둥근 칸을 흰 면으로 채우고 겹친 층 아이콘을 바탕색으로. 무채색 화면에서 또렷하게 */
.logo .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--text);color:var(--bg)}
.logo .mark svg{width:17px;height:17px}
.search{flex:1;min-width:0;max-width:420px;position:relative}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);padding:0 14px;font:inherit;font-size:15px;transition:border-color var(--fast)}
.search input::placeholder{color:var(--text-faint)}
.search input:hover{border-color:var(--line-hover)}
.sug{position:absolute;left:0;right:0;top:50px;background:var(--card);border:1px solid var(--line-hover);border-radius:12px;overflow:hidden;z-index:30}
.sug button{display:flex;justify-content:space-between;gap:10px;width:100%;min-height:44px;align-items:center;padding:10px 14px;font-size:15px;transition:background var(--fast)}
.sug button:hover,.sug button.on{background:var(--fill-hover)}
.sug .m{color:var(--text-faint);font-size:13px;white-space:nowrap}
.sug .none{padding:11px 14px;color:var(--text-sub);font-size:13px}

main.inner{display:grid;gap:20px;padding-block:28px 48px}
/* 카드: 한 색의 면(925) + 가는 회색 테두리(800). 그라데이션·반투명 없이 어디서나 같은 검정 */
.card,.judge{background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);padding:24px;min-width:0}
.card>h2,.sec-h h2{font-size:17px;font-weight:700}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* 회사 머리: 이름이 먼저, 그 아래 한 줄. 판단 카드와 떨어뜨린다 */
.co{padding:12px 0 8px}
.co .meta{font-size:13px;color:var(--text-sub);margin-top:4px;letter-spacing:0}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.3}

/* ① 판단 카드: 화면에서 유일하게 2px 테두리 */
.judge{border-width:2px;border-color:var(--line-strong);border-top-color:var(--line-selected)}
.judge.hold{border-style:dashed}
.jh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--text-sub)}
.jh b{font-size:15px;font-weight:700;color:var(--text)}
.vrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius-pill);padding:6px 16px;font-size:20px;font-weight:800;letter-spacing:-.02em;border:1px solid;line-height:1.3}
/* 배지 면은 불투명 카드색 위에 겹친 옅은 색. 강한 호재·악재만 색으로 채운다 */
.badge.up{background:linear-gradient(var(--up-soft),var(--up-soft)),var(--card);border-color:var(--up-line)}
.badge.down{background:linear-gradient(var(--down-soft),var(--down-soft)),var(--card);border-color:var(--down-line)}
.badge .sh{font-size:13px}
.badge.up.strong{background:var(--up);border-color:var(--up);color:var(--bg)}
.badge.down.strong{background:var(--down);border-color:var(--down);color:var(--bg)}
.badge.flat{color:var(--text-sub);background:linear-gradient(var(--flat-soft),var(--flat-soft)),var(--card);border-color:var(--line-hover)}
.badge.hold{color:var(--text-sub);border-color:var(--line-selected);border-style:dashed}
.count{font-size:13px;color:var(--text-sub)}
.barrow{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:13px;color:var(--text-faint)}
.bar{flex:1;position:relative;height:8px;border-radius:4px;background:var(--flat-soft);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:5px}
.bar .fill.up{background:var(--up)} .bar .fill.down{background:var(--down)} .bar .fill.flat{background:var(--flat)}
.bar .mid{left:50%;width:2px;background:var(--card);margin-left:-1px}
.lede{font-size:17px;font-weight:500;line-height:1.65;margin-top:18px}
.ai{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--ai);background:linear-gradient(var(--ai-soft),var(--ai-soft)),var(--card);border-radius:var(--radius-pill);padding:1px 9px;vertical-align:2px;margin-right:6px;white-space:nowrap;box-shadow:0 0 0 1px rgba(167,139,250,.22),0 0 14px rgba(167,139,250,.18)}
.stale{opacity:.6} /* 분석 실패 때 지난 판단 */
.fail{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding:12px 14px;border:1px solid var(--line-hover);border-radius:12px;font-size:13px;color:var(--text-sub)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--line-hover);background:var(--btn);font-size:15px;color:var(--text);transition:border-color var(--fast),background var(--fast)}
.btn:hover{border-color:var(--line-selected);background:var(--fill-hover)}
.btn:active{background:var(--fill-selected)}
.btn svg{width:15px;height:15px}

/* 판단 근거 */
.basis-h{font-size:13px;font-weight:700;color:var(--text-sub);margin:22px 0 4px}
.ev{list-style:none;margin:0;padding:0}
.ev li{border-top:1px solid var(--line)}
.ev li:first-child{border-top:0}
/* 공시 한 줄: 쉬운 말 한 줄(굵게)이 먼저, 그 아래 날짜와 DART 원문 제목(작게). 칩은 호재·악재 하나만 */
.ev .row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:14px 12px;margin:0 -12px;width:calc(100% + 24px);border-radius:12px;transition:background var(--fast)}
.ev .row:hover{background:var(--fill-hover)}
.ev .row:active,.ev .row[aria-current="true"]{background:var(--fill-selected)}
.tone{font-size:13px;font-weight:700;border-radius:6px;padding:1px 8px;white-space:nowrap;margin-top:1px}
/* 칩 배경은 카드(--card) 위에 한 번 겹친 색으로 고정한다. 선택된 줄 위에서도 글자 대비가 떨어지지 않게 */
.tone.up{background:linear-gradient(var(--up-soft),var(--up-soft)),var(--card);color:var(--up)} .tone.down{background:linear-gradient(var(--down-soft),var(--down-soft)),var(--card);color:var(--down)} .tone.flat{background:linear-gradient(var(--flat-soft),var(--flat-soft)),var(--card);color:var(--text-sub)}
.ev .r{font-size:15px;font-weight:700;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.ev .arr{color:var(--text-faint);font-size:15px;line-height:1.5}
.ev .s{grid-column:2/4;font-size:13px;color:var(--text-faint);line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.chip{color:var(--text-sub);border:1px solid var(--line-hover);border-radius:var(--radius-pill);padding:0 8px;font-size:13px}
.by-ai{color:var(--ai)}
.more-btn{display:flex;align-items:center;gap:6px;min-height:44px;font-size:13px;color:var(--text-sub);font-weight:500}
.more-btn:hover{color:var(--text)}
.chev{width:16px;height:16px;transition:transform var(--fast);flex:none}
[aria-expanded="true"] .chev{transform:rotate(180deg)}
.group-h{font-size:13px;color:var(--text-faint);margin:12px 0 0}
.counter{margin-top:14px;background:var(--surface);border-radius:12px;padding:14px 16px}
.counter h3{font-size:13px;font-weight:700;color:var(--text-sub);margin-bottom:6px}
.counter p{font-size:15px;line-height:1.55}
.counter .s{font-size:13px;color:var(--text-faint);margin-top:4px}
.counter .link{font-size:13px;color:var(--text-sub);min-height:32px;padding:4px 0;margin-top:2px;text-align:left;transition:color var(--fast)}
.counter .link:hover{color:var(--text);text-decoration:underline}
.how{font-size:13px;color:var(--text-sub);margin-top:8px;line-height:1.6}
.foot{display:flex;justify-content:space-between;align-items:center;gap:4px 12px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.foot .notice{margin:0}
.foot .more-btn{min-height:40px}
.notice{font-size:13px;color:var(--text-sub);margin-top:6px}
.empty{font-size:13px;color:var(--text-sub);padding:8px 0}

/* ② 판단 추이 */
.seg{display:inline-flex;gap:6px}
.seg button{min-height:36px;padding:6px 14px;border-radius:var(--radius-pill);border:1px solid var(--line-hover);background:var(--btn);font-size:13px;color:var(--text-sub);transition:border-color var(--fast),color var(--fast)}
.seg button:hover{border-color:var(--line-hover);color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700}
.sub{font-size:13px;color:var(--text-sub);margin-top:4px}
.chart-box{position:relative;margin-top:10px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font);font-size:13px;fill:var(--text-faint)}
.chart .cross{stroke:var(--text-faint);stroke-dasharray:3 3;display:none}
.chart .hdot{fill:var(--text);stroke:var(--card);stroke-width:2;display:none}
.tip{position:absolute;pointer-events:none;display:none;background:var(--text);color:var(--bg);border-radius:8px;padding:5px 10px;font-size:13px;white-space:nowrap;transform:translate(-50%,-125%)}
.day{margin-top:10px;background:var(--surface);border-radius:12px;padding:12px 14px}
.day .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--text-sub);flex-wrap:wrap}
.day .h b{font-weight:700;font-size:15px;color:var(--text)}
.day ul{list-style:none;margin:6px 0 0;padding:0}
.day li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.day li:first-child{border-top:0}
.day .t{font-weight:700;font-size:15px;line-height:1.45;text-decoration:none} .day .t:hover{text-decoration:underline}
.day .s{grid-column:2;font-size:13px;color:var(--text-faint)}
.day .nav{display:flex;justify-content:space-between;gap:10px;margin-top:4px;padding-top:4px;border-top:1px solid var(--line)}
.day .nav button{min-height:40px;font-size:13px;color:var(--text-sub);font-weight:500}
.day .nav button:hover:not(:disabled){color:var(--text)}
.day .nav button:disabled{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--text-faint);margin-top:8px}

/* 접는 칸 */
.disc{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
.disc h2{font-size:17px;font-weight:700}
.disc .sum{font-size:13px;color:var(--text-sub);display:flex;align-items:center;gap:8px;white-space:nowrap}

/* ③ 실적: 정보용 칸이라 hover 없음 */
.fin{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 0}
.fin div{background:var(--surface);border-radius:12px;padding:14px}
.fin dt{font-size:13px;color:var(--text-sub)} .fin dd{margin:2px 0 0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.fin dd small{display:block;font-size:13px;font-weight:700}
.note{font-size:13px;color:var(--text-faint);margin-top:10px}

/* ④ 타임라인 */
.tl{list-style:none;margin:10px 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:69px;top:12px;bottom:12px;width:1px;background:var(--line-hover)}
.tl>li{display:grid;grid-template-columns:48px 44px minmax(0,1fr);gap:0 4px;padding:4px 0;align-items:start}
.tl .d{font-size:13px;color:var(--text-faint);text-align:right;padding-top:12px;white-space:nowrap}
.tl .n{width:11px;height:11px;margin:16px auto 0;background:var(--flat);border-radius:50%;box-shadow:0 0 0 4px var(--card);position:relative;z-index:1}
.tl .n.up{background:none;width:0;height:0;border-radius:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--up);box-shadow:none}
.tl .n.down{background:none;width:0;height:0;border-radius:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:10px solid var(--down);box-shadow:none}
.tl .n.plan{background:var(--card);box-shadow:0 0 0 4px var(--card),inset 0 0 0 1.5px var(--text-faint)}
.tl .n.today{width:14px;height:14px;margin-top:15px;background:var(--text)}
.tl .item{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;padding:8px 10px;border-radius:12px;transition:background var(--fast)}
.tl .item .s{grid-column:1} .tl .item .arr{grid-row:1;grid-column:2;color:var(--text-faint);line-height:1.5}
.tl .item:hover{background:var(--fill-hover)}
.tl .item:active{background:var(--fill-selected)}
.tl .static{padding:8px 10px}
.tl .t{font-weight:500;font-size:15px;line-height:1.5;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;word-break:keep-all;overflow-wrap:anywhere}
.tl .s{font-size:13px;color:var(--text-faint);word-break:keep-all;overflow-wrap:anywhere}
.tl .today-row .t{font-weight:800} .tl .today-row .d{color:var(--text);font-weight:700}
.tl .plan-row .t{color:var(--text-sub)}
.tl .lbl{grid-column:3;font-size:13px;color:var(--text-faint);font-weight:700;padding:8px 10px 0}
.tl .item[aria-current="true"]{background:var(--fill-selected)}
.more{display:block;width:100%;text-align:center;min-height:44px;padding:12px 0 2px;font-size:13px;color:var(--text-sub);font-weight:500}
.more:hover{color:var(--text)}
.is-new{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--fill-selected)}}
.day button.t{font-weight:700;font-size:15px;line-height:1.45;text-align:left}
.day button.t:hover{text-decoration:underline}

/* ⑤ 공시 한 건: 판단 근거, 그래프의 날짜 목록, 타임라인 어디서 눌러도 같은 패널이 열린다 */
.dv-title{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.4;margin-top:12px;word-break:keep-all;overflow-wrap:anywhere}
.dv-src-title{font-size:13px;color:var(--text-sub);margin-top:6px;word-break:keep-all;overflow-wrap:anywhere}
.dv-verdict{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--text-sub)}
.dv-verdict .tone{font-size:15px;padding:2px 10px;margin:0}
.dv-in{font-size:13px;color:var(--text-faint);margin-top:12px}
.dv-box{margin-top:18px;background:var(--surface);border-radius:12px;padding:14px 16px}

const CODES = Object.keys(DB);

/* ───────── 날짜 ───────── */
function bizDays(endIso,n){ const out=[]; const d=new Date(endIso+"T00:00:00Z");
  while(out.length<n){ const w=d.getUTCDay(); if(w!==0&&w!==6) out.unshift(d.toISOString().slice(0,10)); d.setUTCDate(d.getUTCDate()-1);} return out; }
const DATES = bizDays(ASOF,140), LAST = DATES.length-1, IDX = Object.fromEntries(DATES.map((d,i)=>[d,i]));
const bdx = iso => { if(IDX[iso]!=null) return IDX[iso]; let i=LAST; while(i>0 && DATES[i]>iso) i--; return i; };
const bday = iso => DATES[bdx(iso)];
const dnum = iso => Math.round(Date.parse(iso+"T00:00:00Z")/86400000);
const PERIODS = [["1m","1개월",21],["3m","3개월",63],["6m","6개월",125]];
const periodOf = key => PERIODS.find(p=>p[0]===key);

/* ───────── 판단 (코드가 계산) ─────────
   최근 30일 공시의 크기 합: (호재 합 − 악재 합) ÷ (호재 합 + 악재 합 + 5)
   +5는 공시가 적을 때 극단값이 나오지 않게 하는 완충값.
   호재·악재로 판정된 공시가 하나도 없으면 "판단 보류"(가정: 중립과 구분하려는 것) */
const WINDOW = 30, DAMP = 5;
function scoreAt(co, iso){
  const t = dnum(iso); let U=0, D=0; const list=[];
  for(const e of co.events){ const k=t-dnum(e.d); if(k>=0 && k<WINDOW){ list.push(e); if(e.tone==="up") U+=e.imp; else if(e.tone==="down") D+=e.imp; } }
  return { s:(U-D)/(U+D+DAMP), U, D, list, hold: U+D===0 };
}
const BAND = 0.15, STRONG = 0.45; /* 단계 경계. 그래프의 선 색도 같은 경계를 쓴다 */
const verdictOf = s => s>=STRONG?["강한 호재","up",true]:s>=BAND?["약한 호재","up",false]:s>-BAND?["중립","flat",false]:s>-STRONG?["약한 악재","down",false]:["강한 악재","down",true];
const SHAPE = {up:"▲",down:"▼",flat:"—"};
const SIZE = ["","작음","보통","큼"];

/* 금액(억 원 단위 값)을 읽기 쉬운 단위로: 1조 이상은 소수 둘째 자리까지 "237.3조", "1.63조", 그 아래는 "3,900억" */
const won = v => v>=10000 ? `${(v/10000).toLocaleString("ko-KR",{maximumFractionDigits:2})}조` : `${v.toLocaleString("ko-KR")}억`;
const pct = (v,d=1) => (v>0?"+":"")+(v*100).toFixed(d)+"%";
const toneOf = v => v>0?"up":v<0?"down":"flat";
const md = iso => iso.slice(5).replace("-",".");
const TONE = {up:"호재",down:"악재",flat:"중립"};
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CHEV = `<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>`;
const AI = `<span class="ai">AI 요약</span>`;
const DART = "https://dart.fss.or.kr/";

let state = { code:"005930", period:"3m", sel:null, all:false, fin:false, more:false, how:false, fail:false, dv:null };

function dayEvents(co){ const m={}; co.events.forEach(e=>{ const k=bday(e.d); (m[k]=m[k]||[]).push(e); }); return m; }

/* 위: 판단 선 / 아래: 일별 공시 막대(호재는 위, 악재는 아래, 높이는 크기 합) */
function chart(co){
  const n = periodOf(state.period)[2], from = LAST-n;
  const SC = DATES.slice(from).map(d=>scoreAt(co,d)), S = SC.map(c=>c.s), HOLD = SC.map(c=>c.hold);
  const W=680,H=270,L=4,R=44,T=12,PB=158,ST=176,B=26, SB=H-B, ym=(ST+SB)/2;
  const cw = (W-L-R)/n;
  const x = i => L+cw*(i-from), y = v => T+(PB-T)*(1-(v+1)/2), y0 = y(0), yU = y(BAND), yD = y(-BAND);
  const P = S.map((v,j)=>`${x(from+j).toFixed(1)},${y(v).toFixed(1)}`), pts = P.join(" ");
  const area = `${x(from).toFixed(1)},${y0} ${pts} ${x(LAST).toFixed(1)},${y0}`;
  /* 선을 판단이 있는 구간과 판단 보류 구간(양 끝 날이 모두 보류)으로 나눈다. 보류 구간은 회색 점선 */
  const runs = []; for(let j=1;j<P.length;j++){ const hold = HOLD[j-1] && HOLD[j], last = runs[runs.length-1];
    if(last && last.hold===hold) last.p.push(P[j]); else runs.push({hold, p:[P[j-1],P[j]]}); }
  const line = (stroke,clip) => runs.filter(r=>!r.hold).map(r=>`<polyline points="${r.p.join(" ")}" fill="none" stroke="var(${stroke})" stroke-width="2" stroke-linejoin="round" clip-path="url(#${clip})"/>`).join("");
  const holdLines = runs.filter(r=>r.hold).map(r=>`<polyline points="${r.p.join(" ")}" fill="none" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="3 4"/>`).join("");
  /* 격자 점선 없이: 중립 구간(판단 단계 경계 ±BAND)만 옅은 띠로, 이름표는 호재·중립·악재 셋 */
  const grid = `<rect x="${L}" y="${yU}" width="${W-R-L}" height="${yD-yU}" fill="var(--fill-hover)"/>
    <line x1="${L}" x2="${W-R}" y1="${y0}" y2="${y0}" stroke="var(--line-hover)"/>
    <text x="${W-R+8}" y="${y(0.6)+4}">호재</text><text x="${W-R+8}" y="${y0+4}">중립</text><text x="${W-R+8}" y="${y(-0.6)+4}">악재</text>`;
  const byDay = dayEvents(co);
  const sums = i => { let u=0,d=0,f=0; (byDay[DATES[i]]||[]).forEach(e=>{ if(e.tone==="up") u+=e.imp; else if(e.tone==="down") d+=e.imp; else f++; }); return {u,d,f}; };
  let mx = 3; for(let i=from;i<=LAST;i++){ const s=sums(i); mx=Math.max(mx,s.u,s.d); }
  const k = (ym-ST-2)/mx, bw = Math.max(2, Math.min(10, cw*0.75));
  let bars = "";
  for(let i=from;i<=LAST;i++){ const {u,d,f}=sums(i), bx=(x(i)-bw/2).toFixed(1);
    if(u) bars += `<rect x="${bx}" y="${(ym-u*k).toFixed(1)}" width="${bw.toFixed(1)}" height="${(u*k).toFixed(1)}" rx="1" fill="var(--up)"/>`;
    if(d) bars += `<rect x="${bx}" y="${ym}" width="${bw.toFixed(1)}" height="${(d*k).toFixed(1)}" rx="1" fill="var(--down)"/>`;
    if(!u && !d && f) bars += `<rect x="${bx}" y="${ym-2}" width="${bw.toFixed(1)}" height="4" rx="1" fill="var(--flat)" opacity=".6"/>`; }
  const si = state.sel && IDX[state.sel]!=null && IDX[state.sel]>=from ? IDX[state.sel] : null, hw = Math.max(cw, 8);
  const selMark = si==null ? "" : `<rect x="${(x(si)-hw/2).toFixed(1)}" y="${T}" width="${hw.toFixed(1)}" height="${SB-T}" fill="var(--fill-selected)"/>
    <line x1="${x(si)}" x2="${x(si)}" y1="${T}" y2="${SB}" stroke="var(--text)" stroke-width="1"/><circle cx="${x(si)}" cy="${y(S[si-from])}" r="5" fill="var(--text)" stroke="var(--card)" stroke-width="2"/>`;
  const mid = from+Math.round(n/2);
  G = { from, n, L, W, H, T, PB, SB, cw, S, byDay };
  return `<div class="chart-box"><svg class="chart" id="svg" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="${co.name} ${periodOf(state.period)[1]} 판단 추이와 일별 공시. 좌우 방향키로 날짜를 옮길 수 있어요">
    <defs><clipPath id="cu"><rect x="0" y="0" width="${W}" height="${yU}"/></clipPath><clipPath id="cf"><rect x="0" y="${yU}" width="${W}" height="${yD-yU}"/></clipPath><clipPath id="cd"><rect x="0" y="${yD}" width="${W}" height="${PB-yD+2}"/></clipPath></defs>
    ${grid}
    <polygon points="${area}" fill="var(--up-soft)" clip-path="url(#cu)"/><polygon points="${area}" fill="var(--down-soft)" clip-path="url(#cd)"/>
    ${line("--up","cu")}${line("--down","cd")}${line("--flat","cf")}${holdLines}
    <line x1="${L}" x2="${W-R}" y1="${ym}" y2="${ym}" stroke="var(--line)"/>
    <text x="${W-R+8}" y="${ym+4}">공시</text>
    ${bars}
    ${selMark}
    <line class="cross" id="cx" y1="${T}" y2="${SB}"/><circle class="hdot" id="hdot" r="4.5"/>
    <rect x="${L}" y="0" width="${W-L-R+cw}" height="${SB}" fill="transparent" style="cursor:pointer"/>
    <text x="${x(from)}" y="${H-6}">${md(DATES[from])}</text><text x="${x(mid)}" y="${H-6}" text-anchor="middle">${md(DATES[mid])}</text><text x="${x(LAST)}" y="${H-6}" text-anchor="end">${md(DATES[LAST])}</text>
  </svg><div class="tip" id="tip"></div></div>`;
}

/* ───────── 공시 한 건 (오른쪽 패널) ─────────
   판단 근거, 그래프의 날짜 목록, 타임라인 어디서 눌러도 같은 패널이 열린다. 내용은 dvHTML 하나.
   공시마다 주소(#d=…)를 붙여 공유와 뒤로 가기가 된다. 실제 화면에서는 DART 접수번호를 쓴다. */
const keyOf = e => e.d+"|"+e.t+"|"+e.r;
const findEv = (co,key) => co.events.find(e=>keyOf(e)===key);
const sorted = co => [...co.events].sort((a,b)=>b.d.localeCompare(a.d));
const BY_HOW = {"제목 규칙":"제목만으로 판정하는 공시 유형이라 본문을 읽지 않았어요.","본문 숫자":"본문 표의 숫자를 코드가 읽어 판정했어요.","AI":"본문의 글을 AI가 읽고 판정했어요."};
const ymd = iso => iso.replaceAll("-",".");

function dvHTML(co, e){
  const age = dnum(ASOF)-dnum(e.d);

    : age<WINDOW ? "최근 30일 공시라 지금 판단에 들어가 있어요." : "30일이 지나 지금 판단에는 들어가지 않아요.";
  const sum = e.s
    ? `<div class="dv-box ai-box">${AI}<ul>${e.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p>요약의 금액·비율·날짜는 코드가 원문과 맞는지 확인했어요.</p></div>`
    : `<div class="dv-box"><h3>요약</h3><p style="margin:0">${e.tone==="flat"?"중립 공시는 요약하지 않아요. 제목과 원문으로 확인해 주세요.":"요약을 아직 만들지 않았어요. 다음 분석 때 채워져요."}</p></div>`;

  return `<div class="dv">

    <h2 class="dv-title" id="dv-title">${esc(e.r)}</h2>
    <p class="dv-src-title">DART 공시 제목 · ${esc(e.t)}</p>
    <p class="dv-in">${inJudge}</p>
    ${sum}${how}
    <a class="btn dv-src" href="${DART}" target="_blank" rel="noopener">DART에서 원문 보기 ↗</a>
    <p class="notice">AI 요약은 틀릴 수 있으며 투자 권유가 아니에요.</p></div>`;
}

/* 이전·다음 공시 (날짜순, 이전 = 더 오래된 공시) */
function neighbors(co,key){ const l=sorted(co), i=l.findIndex(e=>keyOf(e)===key); return { older:l[i+1]||null, newer:l[i-1]||null }; }
const navBtns = (co,key) => { const {older,newer}=neighbors(co,key);
  return `<button type="button" data-step="${older?esc(keyOf(older)):""}" ${older?"":"disabled"}>← 이전 공시${older?" "+md(older.d):""}</button><button type="button" data-step="${newer?esc(keyOf(newer)):""}" ${newer?"":"disabled"}>다음 공시${newer?" "+md(newer.d):""} →</button>`; };

/* 판단 근거 한 줄 = 공시 한 건 */
const evRow = e => `<li><button type="button" class="row" data-dv="${esc(keyOf(e))}">
    <span class="tone ${e.tone}"><span aria-hidden="true">${SHAPE[e.tone]}</span><span class="tw"> ${TONE[e.tone]}</span></span><span class="r">${esc(e.r)}</span><span class="arr" aria-hidden="true">›</span>
    <span class="s num">${md(e.d)} · ${esc(e.t)}${e.by==="AI"?` · <span class="by-ai">AI 판정</span>`:""}</span></button></li>`;

function judgeCard(co){
  const day = state.fail ? DATES[LAST-1] : ASOF;
  const now = scoreAt(co, day), recent = now.list;
  const dir = recent.filter(e=>e.tone!=="flat"), nUp = dir.filter(e=>e.tone==="up").length, nDn = dir.length-nUp;
  const head = `<div class="jh"><b>최근 공시 기준 판단</b><span class="num">${md(day)} 기준 · 최근 30일 공시</span></div>`;
  const failBox = state.fail ? `<div class="fail"><span>${md(ASOF)} 공시 분석이 끝나지 않아 ${md(day)} 판단을 보여주고 있어요. 새 공시는 다음 분석 때 반영돼요.</span><button type="button" class="btn" data-retry><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>다시 불러오기</button></div>` : "";
  const foot = `<div class="foot"><p class="notice">AI 요약은 틀릴 수 있으며 투자 권유가 아니에요.</p>
      <button type="button" class="more-btn" data-toggle="how" aria-expanded="${state.how}">계산 방식${CHEV}</button></div>
    ${state.how?`<p class="how">공시마다 호재·악재와 크기를 정하고(제목 규칙, 본문 숫자, 나머지는 AI), 판단은 최근 30일 공시의 크기를 더해 코드가 계산해요. 같은 공시면 언제 계산해도 같은 결과가 나와요. 공시마다 DART 원문으로 확인할 수 있어요.</p>`:""}`;

  if(now.hold){
    return `<section class="judge hold" aria-label="판단">${head}
      <div class="vrow"><span class="badge hold">판단 보류</span><span class="count num">최근 30일 공시 ${recent.length}건 · 모두 중립</span></div>
      <p class="lede">최근 30일에 호재나 악재로 판정된 공시가 없어 판단을 내리지 않았어요. 판정된 공시가 들어오면 다시 계산해요.</p>
      ${recent.length?`<h3 class="basis-h">최근 30일 공시</h3><ul class="ev">${recent.map(evRow).join("")}</ul>`:""}
      ${failBox}${foot}</section>`;
  }

  const [vText,vCls,strong] = verdictOf(now.s);
  const fillL = now.s>=0 ? 50 : 50+now.s*50, fillW = Math.abs(now.s)*50;
  const byImp = (a,b)=> b.imp-a.imp || b.d.localeCompare(a.d);
  const pos = dir.filter(e=>e.tone==="up").sort(byImp), neg = dir.filter(e=>e.tone==="down").sort(byImp);
  const main = vCls==="up" ? pos : vCls==="down" ? neg : [...dir].sort(byImp);
  const top = main.slice(0,3), rest = dir.filter(e=>!top.includes(e)).sort(byImp);
  const opp = vCls==="up" ? neg[0] : vCls==="down" ? pos[0] : null;
  const counter = vCls==="flat"
    ? `<div class="counter"><h3>반대로 볼 수 있는 점</h3><p>호재 ${nUp}건(크기 합 ${now.U})과 악재 ${nDn}건(크기 합 ${now.D})이 비슷하게 맞서 있어요. 새 공시 한 건으로 판단이 바뀔 수 있어요.</p></div>`
    : opp ? `<div class="counter"><h3>반대로 볼 수 있는 점</h3><p>${esc(opp.r)}</p><button type="button" class="link num" data-dv="${esc(keyOf(opp))}">${TONE[opp.tone]} · ${esc(opp.t)} · ${md(opp.d)} ›</button></div>`
    : `<div class="counter"><h3>반대로 볼 수 있는 점</h3><p>최근 30일에 ${vCls==="up"?"악재":"호재"}로 판정된 공시는 없었어요.</p></div>`;

  return `<section class="judge" aria-label="판단">${head}
    <div class="${state.fail?"stale":""}">
      <div class="vrow"><span class="badge ${vCls}${strong?" strong":""}"><span class="sh" aria-hidden="true">${SHAPE[vCls]}</span>${vText}</span>
        <span class="count num">근거 공시 ${dir.length}건 · 호재 ${nUp} · 악재 ${nDn}</span></div>
      <div class="barrow"><span aria-hidden="true">악재</span><div class="bar" role="img" aria-label="호재·악재 정도: ${vText}. 가운데가 중립"><i class="fill ${vCls}" style="left:${fillL}%;width:${fillW}%"></i><i class="mid"></i></div><span aria-hidden="true">호재</span></div>
      <p class="lede ai-box">${AI}${esc(co.lede)}</p>
    </div>
    ${failBox}
    <h3 class="basis-h">판단 근거</h3>
    <ul class="ev">${top.map(evRow).join("")}</ul>
    ${rest.length?`<button type="button" class="more-btn" data-toggle="all" aria-expanded="${state.all}">${state.all?"근거 접기":`나머지 근거 ${rest.length}건 보기`}${CHEV}</button>
      ${state.all?`<ul class="ev">${rest.map(evRow).join("")}</ul>`:""}`:""}
    ${counter}
    ${foot}</section>`;
}

function fillDrawer(co,e){ const key=keyOf(e);
  $("drawer-co").textContent = `${co.name} · 공시 한 건`;
  $("drawer-b").innerHTML = dvHTML(co,e); $("drawer-b").scrollTop = 0;
  $("drawer-f").innerHTML = navBtns(co,key);
  markCurrent(key); }
/* 패널에 열린 공시의 줄을 선택 상태로 표시 */
const markCurrent = key => document.querySelectorAll("#app [data-dv]").forEach(b=>{ if(key && b.dataset.dv===key) b.setAttribute("aria-current","true"); else b.removeAttribute("aria-current"); });
function openDrawer(key, from){
  const co=DB[state.code], e=findEv(co,key); if(!e) return;
  const wasOpen = !!state.dv; state.dv=key; if(from) opener=from;
  fillDrawer(co,e);
  const d=$("drawer"), s=$("scrim");
  if(!wasOpen){ d.hidden=false; s.hidden=false; setInert(true);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ d.classList.add("on"); s.classList.add("on"); })); }
  d.querySelector("[data-close]").focus({preventScroll:true}); }
const setInert = on => ["header","#app","footer"].forEach(sel=>{ document.querySelector(sel).inert=on; });
function closeDrawer(){ if(!state.dv) return; state.dv=null;
  const d=$("drawer"), s=$("scrim"); d.classList.remove("on"); s.classList.remove("on"); setInert(false);
  setTimeout(()=>{ if(!state.dv){ d.hidden=true; s.hidden=true; } }, 220);
  markCurrent(null);
  if(opener && document.contains(opener)) opener.focus({preventScroll:true}); }

/* 주소: 패널을 열면 공시 주소(#d=…)가 붙고, 뒤로 가기로 닫힌다 */
function go(key, how){ const url = "#d="+encodeURIComponent(key);
  try{ if(how==="replace") history.replaceState({key},"",url); else history.pushState({key},"",url); }catch(_){ /* 주소를 바꿀 수 없는 미리보기 */ } }
window.addEventListener("popstate",ev=>{ const key = ev.state && ev.state.key; if(key) openDrawer(key); else closeDrawer(); });

function render(){
  const co = DB[state.code];
  const now = scoreAt(co, ASOF), [vText,vCls] = now.hold ? ["판단 보류","flat"] : verdictOf(now.s);
  const [pKey,pLabel,n] = periodOf(state.period), from = LAST-n;
  const s0 = scoreAt(co, DATES[from]), v0 = s0.hold ? "판단 보류" : verdictOf(s0.s)[0];
  let selList = null, selHead = "", selMove = "", navPrev = null, navNext = null;
  if(state.sel && IDX[state.sel]!=null && IDX[state.sel]>=from){
    const a = state.sel, i = IDX[a], sc = scoreAt(co,a), sv = sc.s, dlt = sv - scoreAt(co,DATES[Math.max(0,i-1)]).s;
    const [svT,svC] = sc.hold ? ["판단 보류","flat"] : verdictOf(sv);
    selList = co.events.filter(e=>bday(e.d)===a);
    selHead = `${md(a)} · <span class="${svC}">${svT}</span>`;
    selMove = !selList.length ? `<span>이날 공시 없음</span>` : Math.abs(dlt)<0.01 ? `<span>공시 ${selList.length}건 · 판단 변화 없음</span>`
      : `<span>공시 ${selList.length}건 · <span class="${dlt>0?"up":"down"}">판단이 ${dlt>0?"호재":"악재"} 쪽으로 움직임</span></span>`;
    const evDays = [...new Set(co.events.map(e=>bday(e.d)))].filter(d=>IDX[d]>=from).sort();
    navPrev = evDays.filter(d=>d<a).pop() || null; navNext = evDays.find(d=>d>a) || null; }

  const f = co.fin, rg = f.rev[0]/f.rev[1]-1, og = f.op[0]/f.op[1]-1, ng = f.ni[0]/f.ni[1]-1;
  const mg0 = f.op[0]/f.rev[0]*100, mg1 = f.op[1]/f.rev[1]*100, mgd = Math.round(mg0*10)/10 - Math.round(mg1*10)/10;
  const past = [...co.events].sort((a,b)=>b.d.localeCompare(a.d));
  const shownPast = state.more ? past : past.slice(0,PAGE);
  const plans = [...co.watch].sort((a,b)=>b[0].localeCompare(a[0]));

  $("app").innerHTML = `
  <div class="co"><h1>${co.name}</h1><div class="meta num">${state.code} · ${co.market} · ${co.sector}</div></div>

  ${judgeCard(co)}

  <section class="card" aria-label="판단 추이">
    <div class="sec-h"><h2>판단 추이</h2>
      <div class="seg" role="group" aria-label="기간">${PERIODS.map(([k,l])=>`<button type="button" data-period="${k}" aria-pressed="${k===pKey}">${l}</button>`).join("")}</div></div>
    <p class="sub">${pLabel} 전 <b>${v0}</b> → 지금 <b class="${vCls}">${vText}</b></p>
    ${chart(co)}
    ${selList ? `<div class="day num"><div class="h"><b>${selHead}</b>${selMove}</div>
        ${selList.length ? `<ul>${selList.map(e=>`<li><span class="tone ${e.tone}">${SHAPE[e.tone]} ${TONE[e.tone]}</span><button type="button" class="t" data-dv="${esc(keyOf(e))}">${esc(e.r)}</button><span class="s">${e.d!==state.sel?md(e.d)+"(주말) · ":""}${esc(e.t)}</span></li>`).join("")}</ul>`
          : `<p class="empty">이날 들어온 공시는 없어요. 판단은 최근 30일 공시로 계산돼요.</p>`}
        <div class="nav"><button type="button" data-go="${navPrev||""}" ${navPrev?"":"disabled"}>← 이전 공시${navPrev?" "+md(navPrev):""}</button><button type="button" data-go="${navNext||""}" ${navNext?"":"disabled"}>다음 공시${navNext?" "+md(navNext):""} →</button></div></div>`
      : `<p class="hint">그래프를 누르면 그날의 판단과 공시가 보여요. 점선은 호재·악재 공시가 없어 판단을 보류한 기간이에요. 아래 막대는 그날 들어온 호재·악재 공시이고, 길수록 크기가 커요.</p>`}
  </section>

  <section class="card" aria-label="실적">
    <button type="button" class="disc" data-toggle="fin" aria-expanded="${state.fin}"><h2>실적</h2>
      <span class="sum num">영업이익 <b class="${toneOf(og)}">${pct(og)}</b>${CHEV}</span></button>
    ${state.fin ? `<dl class="fin num">
        <div><dt>매출액</dt><dd>${won(f.rev[0])}<small class="${toneOf(rg)}">1년 전보다 ${pct(rg)}</small></dd></div>
        <div><dt>영업이익</dt><dd>${won(f.op[0])}<small class="${toneOf(og)}">1년 전보다 ${pct(og)}</small></dd></div>
        <div><dt>영업이익률</dt><dd>${mg0.toFixed(1)}%<small class="${toneOf(mgd)}">${mgd>0?"+":""}${mgd.toFixed(1)}%p</small></dd></div>
        <div><dt>순이익</dt><dd>${won(f.ni[0])}<small class="${toneOf(ng)}">1년 전보다 ${pct(ng)}</small></dd></div></dl>
      <p class="note">2026년 3분기 누적 · 연결 기준 · 출처 DART</p>` : ""}
  </section>

  <section class="card" aria-label="타임라인">
    <h2>타임라인</h2>
    <ul class="tl num">
      ${plans.length?`<li><span></span><span></span><span class="lbl">다가오는 일정 ${plans.length}건</span></li>`:""}
      ${plans.map(([d,t,s])=>`<li class="plan-row"><span class="d">${md(d)}</span><span class="n plan"></span><span class="static"><span class="t">${t}</span><span class="s">${s} · 예정</span></span></li>`).join("")}
      <li class="today-row"><span class="d">${md(ASOF)}</span><span class="n today"></span><span class="static"><span class="t">오늘 · <span class="${vCls}">${vText}</span></span><span class="s">최근 공시 기준 판단</span></span></li>
      ${shownPast.map(e=>`<li><span class="d">${md(e.d)}</span><span class="n ${e.tone}" aria-hidden="true"></span><div>
          <button type="button" class="item" data-dv="${esc(keyOf(e))}"><span class="t"><span class="sr">${TONE[e.tone]}: </span>${esc(e.r)}</span><span class="arr" aria-hidden="true">›</span><span class="s">${esc(e.t)}${e.by==="AI"?` · <span class="by-ai">AI 판정</span>`:""}</span></button>
        </div></li>`).join("")}
    </ul>
    ${past.length>PAGE ? `<button type="button" class="more" data-more>${state.more?"접기":`지난 공시 ${past.length-PAGE}건 더 보기`}</button>` : ""}
  </section>`;
  bindHover(co);
}

/* 호버: 가장 가까운 날로 맞춤 / 클릭: 그날 선택 / 좌우 방향키: 하루씩 이동 */
function bindHover(co){
  const svg=$("svg"), tip=$("tip"), cx=$("cx"), hd=$("hdot"); if(!svg||!G) return;
  const {from,n,L,W,H,T,PB,cw,S,byDay} = G;
  const x = i => L+cw*(i-from), y = v => T+(PB-T)*(1-(v+1)/2);
  const idxAt = ev => { const r=svg.getBoundingClientRect(), px=(ev.clientX-r.left)/r.width*W; return Math.max(from,Math.min(LAST,from+Math.round((px-L)/cw))); };
  const show = ev => { const i=idxAt(ev), v=S[i-from], X=x(i), Y=y(v), k=(byDay[DATES[i]]||[]).length;
    cx.setAttribute("x1",X); cx.setAttribute("x2",X); cx.style.display="block"; hd.setAttribute("cx",X); hd.setAttribute("cy",Y); hd.style.display="block";
    tip.style.display="block"; tip.style.left=(X/W*100)+"%"; tip.style.top=(Y/H*100)+"%";
    const sc=scoreAt(co,DATES[i]); tip.textContent=`${md(DATES[i])} · ${sc.hold?"판단 보류":verdictOf(v)[0]}${k?` · 공시 ${k}건`:""}`; };
  const hide = () => { cx.style.display="none"; hd.style.display="none"; tip.style.display="none"; };
  const pickDay = i => { state.sel = DATES[i]; render(); const s=$("svg"); if(s) s.focus({preventScroll:true}); };
  svg.addEventListener("mousemove",show); svg.addEventListener("mouseleave",hide);
  svg.addEventListener("touchmove",e=>show(e.touches[0]),{passive:true}); svg.addEventListener("touchend",hide);
  svg.addEventListener("click",ev=>{ const i=idxAt(ev); if(state.sel===DATES[i]){ state.sel=null; render(); } else pickDay(i); });
  svg.addEventListener("keydown",ev=>{ if(ev.key!=="ArrowLeft" && ev.key!=="ArrowRight") return; ev.preventDefault();
    const cur = state.sel && IDX[state.sel]>=from ? IDX[state.sel] : LAST+ (ev.key==="ArrowLeft"?1:0);
    pickDay(Math.max(from,Math.min(LAST,cur+(ev.key==="ArrowRight"?1:-1)))); });
}

/* 닫기: 공시 주소가 붙어 있으면 뒤로 가기와 같게 처리한다 */
function dismiss(){ if(history.state && history.state.key){ history.back(); return; } closeDrawer(); }
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape" && state.dv){ ev.preventDefault(); dismiss(); } });

function setDemo(fail){ state.fail=fail; document.querySelectorAll("[data-demo]").forEach(b=>b.setAttribute("aria-pressed", String((b.dataset.demo==="fail")===fail))); render(); }

document.addEventListener("click",ev=>{
  if(ev.target.id==="scrim"){ dismiss(); return; }
  const t=ev.target.closest("[data-period],[data-go],[data-toggle],[data-more],[data-retry],[data-demo],[data-dv],[data-step],[data-close]"); if(!t) return;
  const d=t.dataset;
  if(d.dv!=null){ go(d.dv, state.dv?"replace":"push"); openDrawer(d.dv, t); return; }
  if(d.step!=null){ if(!d.step) return; go(d.step,"replace"); openDrawer(d.step); return; }
  if("close" in d){ dismiss(); return; }
  if(d.demo){ setDemo(d.demo==="fail"); if(d.demo==="fail") window.scrollTo({top:0,behavior:"smooth"}); return; }
  if("retry" in d){ setDemo(false); const j=document.querySelector(".judge"); if(j){ j.classList.add("is-new"); } return; }
  if(d.period){ state.period=d.period; if(state.sel && IDX[state.sel] < LAST-periodOf(d.period)[2]) state.sel=null; }
  else if(d.go!=null){ if(!d.go) return; state.sel=d.go; }
  else if(d.toggle) state[d.toggle]=!state[d.toggle];
  else if("more" in d) state.more=!state.more;
  render();
});

/* 검색 자동완성 */
const q=$("q"), sug=$("sug"); let hi=-1;
const matches = v => { v=v.trim().toLowerCase(); return v? CODES.filter(c=>c.includes(v)||DB[c].name.toLowerCase().includes(v)) : CODES; };
function showSug(){ const m=matches(q.value); hi=-1;
  sug.innerHTML = m.length ? m.map(c=>`<button type="button" data-c="${c}"><span>${DB[c].name}</span><span class="m">${c} · ${DB[c].market}</span></button>`).join("")
    : `<div class="none">데모에는 ${CODES.map(c=>DB[c].name).join(", ")}만 있어요.</div>`;
  sug.hidden=false; }
function pick(c){ if(!c) return; state={code:c,period:"3m",sel:null,all:false,fin:false,more:false,how:false,fail:state.fail,dv:null}; q.value=DB[c].name; sug.hidden=true; render(); window.scrollTo({top:0,behavior:"smooth"}); }
q.addEventListener("input",showSug); q.addEventListener("focus",showSug);
q.addEventListener("keydown",e=>{ const bs=[...sug.querySelectorAll("button")];
  if(e.key==="ArrowDown") hi=Math.min(bs.length-1,hi+1); else if(e.key==="ArrowUp") hi=Math.max(0,hi-1);
  else if(e.key==="Enter"){ e.preventDefault(); pick(hi>=0&&bs[hi]?bs[hi].dataset.c:matches(q.value)[0]); return; }
  else if(e.key==="Escape"){ sug.hidden=true; return; } else return;
  bs.forEach((b,i)=>b.classList.toggle("on",i===hi)); e.preventDefault(); });
sug.addEventListener("mousedown",e=>{ const b=e.target.closest("button"); if(b) pick(b.dataset.c); });
document.addEventListener("click",e=>{ if(!e.target.closest(".search")) sug.hidden=true; });

render();
</script>
