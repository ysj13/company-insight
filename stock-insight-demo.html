<title>종목 인사이트 데모</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 공개용. 시세 없음. ① 결론(호재/악재 막대, 계산 근거) ② 판단 근거(접힘) ③ 판단 추이 차트 ④ 실적·체크리스트(접힘) ⑤ 타임라인(일정 → 오늘 → 소식, 펼치면 핵심 3줄 + 원문). */
:root{
  --page:#f2f4f6; --surface:#ffffff; --sunken:#f5f6f8; --line:#e8eaee;
  --fg:#191f28; --muted:#7b8594;
  --up:#e42939; --up-soft:#fdecee; --down:#2a63d8; --down-soft:#eaf1fd; --flat:#8a94a2; --flat-soft:#eef0f3;
  --good:#11845b;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0f1115; --surface:#191c22; --sunken:#20242b; --line:#2a2f38; --fg:#eceef1; --muted:#9ca5b1;
  --up:#ff5a66; --up-soft:#3b1a1e; --down:#5b8fff; --down-soft:#18264a; --flat:#9ca5b1; --flat-soft:#2a2f38; --good:#3ecf8e; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0f1115; --surface:#191c22; --sunken:#20242b; --line:#2a2f38; --fg:#eceef1; --muted:#9ca5b1;
  --up:#ff5a66; --up-soft:#3b1a1e; --down:#5b8fff; --down-soft:#18264a; --flat:#9ca5b1; --flat-soft:#2a2f38; --good:#3ecf8e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;letter-spacing:-.01em;margin:0}
h1,h2,h3,p{margin:0} h1,h2{text-wrap:balance}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--down);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:680px;margin:0 auto}

/* 상단 바 */
.appbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.appbar .inner{display:flex;align-items:center;gap:14px;padding-block:10px}
.logo{font-weight:800;font-size:17px;white-space:nowrap}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:40px;border:0;border-radius:10px;background:var(--sunken);color:var(--fg);padding:0 14px;font:inherit;font-size:15px}
.sug{position:absolute;left:0;right:0;top:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgb(0 0 0/.14);overflow:hidden;z-index:30}
.sug button{display:flex;justify-content:space-between;gap:10px;width:100%;padding:11px 14px;font-size:15px}
.sug button:hover,.sug button.on{background:var(--sunken)}
.sug .m{color:var(--muted);font-size:13px;white-space:nowrap}
.sug .none{padding:11px 14px;color:var(--muted);font-size:14px}

main.inner{display:grid;gap:12px;padding-block:16px 32px}
.card{background:var(--surface);border-radius:18px;padding:24px;min-width:0}
.card>h2{font-size:16px;font-weight:800;margin-bottom:4px}
.sec{padding-top:18px;margin-top:18px;border-top:1px solid var(--line)}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:16px;font-weight:800}

/* ① 결론 */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.meta{font-size:13px;color:var(--muted)}
h1{font-size:24px;font-weight:800;letter-spacing:-.03em}
.ext{font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;white-space:nowrap}
.ext:hover{color:var(--fg)}
.verdict{margin-top:16px;background:var(--sunken);border-radius:14px;padding:14px 16px}
.verdict .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--muted)}
.verdict .row b{font-size:20px;font-weight:800}
.bar{position:relative;height:12px;border-radius:6px;background:var(--line);margin:8px 0 6px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:6px}
.bar .fill.up{background:var(--up)} .bar .fill.down{background:var(--down)} .bar .fill.flat{background:var(--flat)}
.bar .mid{left:50%;width:2px;background:var(--surface);margin-left:-1px}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.when{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.55}
.lede{font-size:16px;font-weight:500;line-height:1.65;margin-top:14px}
.ai-note{font-size:12px;color:var(--muted);margin-top:6px}

/* 펼치기 */
.disc{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 0}
.disc h2{font-size:16px;font-weight:800}
.disc .sum{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.disc .sum b{font-weight:700}
.chev{width:18px;height:18px;transition:transform .15s;flex:none}
[aria-expanded="true"] .chev{transform:rotate(180deg)}
.body{margin-top:12px}
.note{font-size:13px;color:var(--muted);margin-top:10px}

/* ② 근거 */
.why{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.why h3{font-size:13px;font-weight:700;margin-bottom:4px;color:var(--muted)}
.why ul{list-style:none;margin:0;padding:0}
.why li{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:0 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.why li:last-child{border-bottom:0}
.why b{font-size:15px;font-weight:700;line-height:1.4}
.why .src{font-size:12px;color:var(--muted)}
.ibar{grid-row:span 2;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.ibar i{display:block;height:100%;border-radius:4px}
.pos .ibar i{background:var(--up)} .neg .ibar i{background:var(--down)}
.empty{font-size:14px;color:var(--muted);padding:8px 0}

/* ③ 판단 추이 */
.seg{display:inline-flex;background:var(--sunken);border-radius:10px;padding:3px}
.seg button{padding:5px 11px;border-radius:8px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 1px 2px rgb(0 0 0/.08)}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.chart-box{position:relative;margin-top:8px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font);font-size:12px;fill:var(--muted)}
.chart:focus-visible{outline:2px solid var(--down);outline-offset:4px;border-radius:4px}
.day .nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.day .nav button{font-size:13px;color:var(--muted);font-weight:600;padding:2px 0}
.day .nav button:hover:not(:disabled){color:var(--fg)}
.day .nav button:disabled{opacity:.4;cursor:default}
.chart .cross{stroke:var(--muted);stroke-dasharray:3 3;display:none}
.chart .hdot{fill:var(--fg);stroke:var(--surface);stroke-width:2;display:none}
.tip{position:absolute;pointer-events:none;display:none;background:var(--fg);color:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px;white-space:nowrap;transform:translate(-50%,-125%)}
.day{margin-top:8px;background:var(--sunken);border-radius:12px;padding:10px 14px}
.day .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.day .h b{font-weight:800;font-size:15px;color:var(--fg)}
.day ul{list-style:none;margin:6px 0 0;padding:0}
.day li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px;padding:6px 0;border-top:1px solid var(--line);align-items:start}
.day li:first-child{border-top:0}
.day .t{font-weight:700;font-size:15px;line-height:1.45} .day .s{grid-column:2;font-size:12px;color:var(--muted)}
.day .lnk{text-decoration:none} .day .lnk:hover{text-decoration:underline} .day .arr{color:var(--muted);font-weight:500}
.pill{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap;margin-top:3px}
.pill.up{background:var(--up-soft);color:var(--up)} .pill.down{background:var(--down-soft);color:var(--down)} .pill.flat{background:var(--flat-soft);color:var(--flat)}
.pill.plan{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}

.fin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.fin div{background:var(--sunken);border-radius:12px;padding:14px}
.fin dt{font-size:13px;color:var(--muted)} .fin dd{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.fin dd small{display:block;font-size:12px;font-weight:700}
.checks{list-style:none;margin:14px 0 0;padding:0}
.checks li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.checks li:last-child{border-bottom:0}
.ck{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--surface)}
.ck.ok{background:var(--good)} .ck.no{background:var(--line);color:var(--muted)}
.checks .v{font-size:13px;color:var(--muted);white-space:nowrap}

/* ⑤ 타임라인 */
.tl{list-style:none;margin:8px 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:67px;top:10px;bottom:10px;width:2px;background:var(--line)}
.tl>li{display:grid;grid-template-columns:48px 40px minmax(0,1fr);gap:0 4px;padding:8px 0;align-items:start}
.tl .d{font-size:13px;color:var(--muted);text-align:right;padding-top:3px;white-space:nowrap}
.tl .n{width:12px;height:12px;border-radius:50%;margin:7px auto 0;background:var(--flat);box-shadow:0 0 0 3px var(--surface);position:relative;z-index:1}
.tl .n.up{background:var(--up)} .tl .n.down{background:var(--down)}
.tl .n.plan{background:var(--surface);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--line)}
.tl .n.today{width:16px;height:16px;margin-top:5px;background:var(--fg)}
.tl .item{width:100%;display:block}
.tl .t{font-weight:500;font-size:15px;line-height:1.5;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tl .s{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tl .s .chev{width:14px;height:14px}
.tl .today-row .t{font-weight:800} .tl .today-row .d{color:var(--fg);font-weight:700}
.tl .plan-row .t,.tl .plan-row .d{color:var(--muted)}
.tl .lbl{grid-column:3;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.02em;padding-top:4px}
.detail{margin-top:8px;background:var(--sunken);border-radius:10px;padding:10px 12px}
.detail ul{margin:0;padding-left:18px;font-size:14px;line-height:1.6}
.detail .foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.detail a{font-weight:700;color:var(--fg)}
.more{display:block;width:100%;text-align:center;padding:12px 0 2px;font-size:14px;color:var(--muted);font-weight:500}
footer{text-align:center;font-size:12px;color:var(--muted);padding-block:0 32px;line-height:1.8}

@media (max-width:600px){
  .card{padding:20px 18px} .why{grid-template-columns:1fr;gap:12px} .fin dd{font-size:17px} .disc .sum{display:none}

@media (max-width:400px){

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ───────── 날짜 ───────── */
function bizDays(endIso,n){ const out=[]; const d=new Date(endIso+"T00:00:00Z");
  while(out.length<n){ const w=d.getUTCDay(); if(w!==0&&w!==6) out.unshift(d.toISOString().slice(0,10)); d.setUTCDate(d.getUTCDate()-1);} return out; }
const DATES = bizDays(ASOF,140), LAST = DATES.length-1, IDX = Object.fromEntries(DATES.map((d,i)=>[d,i]));
const bdx = iso => { if(IDX[iso]!=null) return IDX[iso]; let i=LAST; while(i>0 && DATES[i]>iso) i--; return i; };
const bday = iso => DATES[bdx(iso)];
const dnum = iso => Math.round(Date.parse(iso+"T00:00:00Z")/86400000);
const PERIODS = [["1m","1개월",21],["3m","3개월",63],["6m","6개월",125]];
const periodOf = key => PERIODS.find(p=>p[0]===key);

/* ───────── 판단 점수 (코드가 계산) ─────────
   최근 30일 소식의 영향도 합: (호재 합 − 악재 합) ÷ (호재 합 + 악재 합 + 5)
   +5는 소식이 적을 때 극단값이 나오지 않게 하는 완충값 */
const WINDOW = 30, DAMP = 5;
function scoreAt(co, iso){
  const t = dnum(iso); let U=0, D=0; const list=[];
  for(const e of co.events){ const k=t-dnum(e.d); if(k>=0 && k<WINDOW){ list.push(e); if(e.tone==="up") U+=e.imp; else if(e.tone==="down") D+=e.imp; } }
  return { s:(U-D)/(U+D+DAMP), U, D, list };
}
const verdictOf = s => s>=0.45?["강한 호재","up"]:s>=0.15?["약한 호재","up"]:s>-0.15?["중립","flat"]:s>-0.45?["약한 악재","down"]:["강한 악재","down"];

const won = v => v.toLocaleString("ko-KR");
const pct = (v,d=1) => (v>0?"+":"")+(v*100).toFixed(d)+"%";
const toneOf = v => v>0?"up":v<0?"down":"flat";
const md = iso => iso.slice(5).replace("-",".");
const TONE = {up:"호재",down:"악재",flat:"중립"};
const CHEV = `<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>`;

/* 영업일별 소식 묶음 (주말 소식은 직전 영업일) */
function dayEvents(co){ const m={}; co.events.forEach(e=>{ const k=bday(e.d); (m[k]=m[k]||[]).push(e); }); return m; }

/* 위: 판단 점수 선 / 아래: 일별 소식 막대(호재는 위, 악재는 아래, 높이는 영향도 합)
   그래프 어디를 눌러도 가장 가까운 날이 선택된다 */
function chart(co){
  const n = periodOf(state.period)[2], from = LAST-n;
  const S = DATES.slice(from).map(d=>scoreAt(co,d).s);
  const W=680,H=270,L=4,R=70,T=12,PB=158,ST=176,B=26, SB=H-B, ym=(ST+SB)/2;
  const cw = (W-L-R)/n;
  const x = i => L+cw*(i-from), y = v => T+(PB-T)*(1-(v+1)/2), y0 = y(0);
  const pts = S.map((v,j)=>`${x(from+j).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const area = `${x(from).toFixed(1)},${y0} ${pts} ${x(LAST).toFixed(1)},${y0}`;
  const grid = [[1,"강한 호재"],[0.5,""],[0,"중립"],[-0.5,""],[-1,"강한 악재"]].map(([v,l])=>
    `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v===0?'stroke-width="1.5"':'stroke-dasharray="2 4"'}/>${l?`<text x="${W-R+8}" y="${y(v)+4}">${l}</text>`:""}`).join("");
  const byDay = dayEvents(co);
  const sums = i => { let u=0,d=0,f=0; (byDay[DATES[i]]||[]).forEach(e=>{ if(e.tone==="up") u+=e.imp; else if(e.tone==="down") d+=e.imp; else f++; }); return {u,d,f}; };
  let mx = 3; for(let i=from;i<=LAST;i++){ const s=sums(i); mx=Math.max(mx,s.u,s.d); }
  const k = (ym-ST-2)/mx, bw = Math.max(2, Math.min(10, cw*0.75));
  let bars = "";
  for(let i=from;i<=LAST;i++){ const {u,d,f}=sums(i), bx=(x(i)-bw/2).toFixed(1);
    if(u) bars += `<rect x="${bx}" y="${(ym-u*k).toFixed(1)}" width="${bw.toFixed(1)}" height="${(u*k).toFixed(1)}" rx="1" fill="var(--up)"/>`;
    if(d) bars += `<rect x="${bx}" y="${ym}" width="${bw.toFixed(1)}" height="${(d*k).toFixed(1)}" rx="1" fill="var(--down)"/>`;
    if(!u && !d && f) bars += `<rect x="${bx}" y="${ym-2}" width="${bw.toFixed(1)}" height="4" rx="1" fill="var(--flat)"/>`; }
  const si = state.sel && IDX[state.sel]!=null && IDX[state.sel]>=from ? IDX[state.sel] : null, hw = Math.max(cw, 8);
  const selMark = si==null ? "" : `<rect x="${(x(si)-hw/2).toFixed(1)}" y="${T}" width="${hw.toFixed(1)}" height="${SB-T}" fill="var(--fg)" opacity=".07"/>
    <line x1="${x(si)}" x2="${x(si)}" y1="${T}" y2="${SB}" stroke="var(--fg)" stroke-width="1"/><circle cx="${x(si)}" cy="${y(S[si-from])}" r="5" fill="var(--fg)" stroke="var(--surface)" stroke-width="2"/>`;
  const mid = from+Math.round(n/2);
  G = { from, n, L, W, H, T, PB, SB, cw, S, byDay };
  return `<div class="chart-box"><svg class="chart" id="svg" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="${co.name} ${periodOf(state.period)[1]} 호재·악재 판단 추이와 일별 소식. 좌우 방향키로 날짜를 옮길 수 있어요">
    <defs><clipPath id="cu"><rect x="0" y="0" width="${W}" height="${y0}"/></clipPath><clipPath id="cd"><rect x="0" y="${y0}" width="${W}" height="${PB-y0}"/></clipPath></defs>
    ${grid}
    <polygon points="${area}" fill="var(--up-soft)" clip-path="url(#cu)"/><polygon points="${area}" fill="var(--down-soft)" clip-path="url(#cd)"/>
    <polyline points="${pts}" fill="none" stroke="var(--up)" stroke-width="2.2" stroke-linejoin="round" clip-path="url(#cu)"/>
    <polyline points="${pts}" fill="none" stroke="var(--down)" stroke-width="2.2" stroke-linejoin="round" clip-path="url(#cd)"/>
    <line x1="${L}" x2="${W-R}" y1="${ym}" y2="${ym}" stroke="var(--line)"/>
    <text x="${W-R+8}" y="${ST+10}">호재 소식</text><text x="${W-R+8}" y="${SB-2}">악재 소식</text>
    ${bars}
    ${selMark}
    <line class="cross" id="cx" y1="${T}" y2="${SB}"/><circle class="hdot" id="hdot" r="4.5"/>
    <rect x="${L}" y="0" width="${W-L-R+cw}" height="${SB}" fill="transparent" style="cursor:pointer"/>
    <text x="${x(from)}" y="${H-6}">${md(DATES[from])}</text><text x="${x(mid)}" y="${H-6}" text-anchor="middle">${md(DATES[mid])}</text><text x="${x(LAST)}" y="${H-6}" text-anchor="end">${md(DATES[LAST])}</text>
  </svg><div class="tip" id="tip"></div></div>`;
}

        <p class="note">영향도는 AI가 1~3으로 매기고, 판단은 코드가 영향도를 더해 계산해요. 같은 소식이면 언제 계산해도 같은 결과가 나와요.</p></div>` : ""}
    </div>

    <div class="sec">
      <div class="sec-h"><h2>판단은 어떻게 바뀌어 왔나요?</h2>
        <div class="seg" role="group" aria-label="기간">${PERIODS.map(([k,l])=>`<button type="button" data-period="${k}" aria-pressed="${k===pKey}">${l}</button>`).join("")}</div></div>
      <p class="sub">${pLabel} 전 <b>${v0}</b> → 지금 <b class="${vCls}">${vText}</b></p>
      ${chart(co)}
      ${selList ? `<div class="day num"><div class="h"><b>${selHead}</b>${selMove}</div>
          ${selList.length ? `<ul>${selList.map(e=>`<li><span class="pill ${e.tone}">${TONE[e.tone]}</span><a class="t lnk" href="${srcUrl(co,e)}" target="_blank" rel="noopener">${e.t}<span class="arr"> ↗</span></a><span class="s">${e.d!==state.sel?md(e.d)+"(주말) · ":""}${e.src} · 영향 ${e.imp}/3 · ${e.src==="공시"?"DART 원문":"기사 원문"}으로 이동</span></li>`).join("")}</ul>`
            : `<p class="empty">이날 들어온 소식은 없어요. 판단은 최근 30일 소식으로 계산돼요.</p>`}
          <div class="nav"><button type="button" data-go="${navPrev||""}" ${navPrev?"":"disabled"}>← 이전 소식${navPrev?" "+md(navPrev):""}</button><button type="button" data-go="${navNext||""}" ${navNext?"":"disabled"}>다음 소식${navNext?" "+md(navNext):""} →</button></div></div>`
        : `<p class="hint">그래프를 누르면 그날의 판단과 소식이 보여요. 아래 막대는 그날 들어온 호재·악재 소식이고, 길수록 영향이 커요.</p>`}
    </div>

    <div class="sec">
      <button type="button" class="disc" data-toggle="fin" aria-expanded="${state.fin}"><h2>실적은 어때요?</h2>
        <span class="sum num"><b>재무 체크 ${passed}/${checks.length}</b>${CHEV}</span></button>
      ${state.fin ? `<div class="body"><dl class="fin num">
          <div><dt>매출액</dt><dd>${won(f.rev[0])}억<small class="${toneOf(rg)}">1년 전보다 ${pct(rg)}</small></dd></div>
          <div><dt>영업이익</dt><dd>${won(f.op[0])}억<small class="${toneOf(og)}">1년 전보다 ${pct(og)}</small></dd></div>
          <div><dt>영업이익률</dt><dd>${f.mg[0]}%<small class="${toneOf(mgd)}">${mgd>0?"+":""}${mgd.toFixed(1)}%p</small></dd></div></dl>
        <ul class="checks num">${checks.map(([l,ok,v])=>`<li><span class="ck ${ok?"ok":"no"}" aria-label="${ok?"통과":"미통과"}">${ok?"✓":"–"}</span><span>${l}</span><span class="v">${v}</span></li>`).join("")}</ul>
        <p class="note">2026년 3분기 누적 · 연결 기준 · 출처 DART</p></div>` : ""}
    </div>
  </section>

  <section class="card" aria-label="타임라인">
    <h2>타임라인</h2>
    <ul class="tl num">
      <li><span></span><span></span><span class="lbl">다가오는 일정 ${plans.length}건</span></li>
      ${plans.map(([d,t,s])=>`<li class="plan-row"><span class="d">${md(d)}</span><span class="n plan"></span><span><span class="t">${t}<span class="pill plan">예정</span></span><span class="s">${s}</span></span></li>`).join("")}
      <li class="today-row"><span class="d">${md(ASOF)}</span><span class="n today"></span><span><span class="t">오늘 · <span class="${vCls}">${vText}</span></span><span class="s">장마감 기준 판단</span></span></li>
      ${shownPast.map(e=>{ const key=e.d+e.t, op=!!state.open[key];
        return `<li><span class="d">${md(e.d)}</span><span class="n ${e.tone}"></span><div>
          <button type="button" class="item" data-open="${key.replace(/"/g,"&quot;")}" aria-expanded="${op}"><span class="t">${e.t}<span class="pill ${e.tone}">${TONE[e.tone]}</span></span><span class="s">${e.src} · 영향 ${e.imp}/3 ${CHEV}</span></button>
          ${op?`<div class="detail">${e.s?`<ul>${e.s.map(x=>`<li>${x}</li>`).join("")}</ul>`:`<p class="empty" style="padding:0">요약 없음 · 제목만 수집된 소식이에요</p>`}
            <div class="foot"><span>AI 요약 · 틀릴 수 있어요</span><a href="${srcUrl(co,e)}" target="_blank" rel="noopener">${e.src==="공시"?"DART 원문":"기사 원문"} ↗</a></div></div>`:""}
        </div></li>`; }).join("")}
    </ul>
    ${past.length>PAGE ? `<button type="button" class="more" data-more>${state.more?"접기":`지난 소식 ${past.length-PAGE}건 더 보기`}</button>` : ""}
  </section>`;
  bindHover(co);
}

/* 호버: 가장 가까운 날로 맞춤 / 클릭: 그날 선택 / 좌우 방향키: 하루씩 이동 */
function bindHover(co){
  const svg=$("svg"), tip=$("tip"), cx=$("cx"), hd=$("hdot"); if(!svg||!G) return;
  const {from,n,L,W,H,T,PB,cw,S,byDay} = G;
  const x = i => L+cw*(i-from), y = v => T+(PB-T)*(1-(v+1)/2);
  const idxAt = ev => { const r=svg.getBoundingClientRect(), px=(ev.clientX-r.left)/r.width*W; return Math.max(from,Math.min(LAST,from+Math.round((px-L)/cw))); };
  const show = ev => { const i=idxAt(ev), v=S[i-from], X=x(i), Y=y(v), k=(byDay[DATES[i]]||[]).length;
    cx.setAttribute("x1",X); cx.setAttribute("x2",X); cx.style.display="block"; hd.setAttribute("cx",X); hd.setAttribute("cy",Y); hd.style.display="block";
    tip.style.display="block"; tip.style.left=(X/W*100)+"%"; tip.style.top=(Y/H*100)+"%"; tip.textContent=`${md(DATES[i])} · ${verdictOf(v)[0]}${k?` · 소식 ${k}건`:""}`; };
  const hide = () => { cx.style.display="none"; hd.style.display="none"; tip.style.display="none"; };
  const pickDay = i => { state.sel = DATES[i]; render(); const s=$("svg"); if(s) s.focus({preventScroll:true}); };
  svg.addEventListener("mousemove",show); svg.addEventListener("mouseleave",hide);
  svg.addEventListener("touchmove",e=>show(e.touches[0]),{passive:true}); svg.addEventListener("touchend",hide);
  svg.addEventListener("click",ev=>{ const i=idxAt(ev); if(state.sel===DATES[i]){ state.sel=null; render(); } else pickDay(i); });
  svg.addEventListener("keydown",ev=>{ if(ev.key!=="ArrowLeft" && ev.key!=="ArrowRight") return; ev.preventDefault();
    const cur = state.sel && IDX[state.sel]>=from ? IDX[state.sel] : LAST+ (ev.key==="ArrowLeft"?1:0);
    pickDay(Math.max(from,Math.min(LAST,cur+(ev.key==="ArrowRight"?1:-1)))); });
}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-period],[data-go],[data-toggle],[data-more],[data-open]"); if(!t) return;
  const d=t.dataset;
  if(d.period){ state.period=d.period; if(state.sel && IDX[state.sel] < LAST-periodOf(d.period)[2]) state.sel=null; }
  else if(d.go!=null){ if(!d.go) return; state.sel=d.go; }
  else if(d.toggle) state[d.toggle]=!state[d.toggle];
  else if(d.open!=null) state.open[d.open]=!state.open[d.open];
  else if("more" in d) state.more=!state.more;
  render();
});

/* 검색 자동완성 */
const q=$("q"), sug=$("sug"); let hi=-1;
const matches = v => { v=v.trim().toLowerCase(); return v? CODES.filter(c=>c.includes(v)||DB[c].name.toLowerCase().includes(v)) : CODES; };
function showSug(){ const m=matches(q.value); hi=-1;
  sug.innerHTML = m.length ? m.map(c=>`<button type="button" data-c="${c}"><span>${DB[c].name}</span><span class="m">${c} · ${DB[c].market}</span></button>`).join("")
    : `<div class="none">데모에는 ${CODES.map(c=>DB[c].name).join(", ")}만 있어요.</div>`;
  sug.hidden=false; }
function pick(c){ if(!c) return; state={code:c,period:"3m",sel:null,why:false,fin:false,more:false,open:{}}; q.value=DB[c].name; sug.hidden=true; render(); window.scrollTo({top:0,behavior:"smooth"}); }
q.addEventListener("input",showSug); q.addEventListener("focus",showSug);
q.addEventListener("keydown",e=>{ const bs=[...sug.querySelectorAll("button")];
  if(e.key==="ArrowDown") hi=Math.min(bs.length-1,hi+1); else if(e.key==="ArrowUp") hi=Math.max(0,hi-1);
  else if(e.key==="Enter"){ e.preventDefault(); pick(hi>=0&&bs[hi]?bs[hi].dataset.c:matches(q.value)[0]); return; }
  else if(e.key==="Escape"){ sug.hidden=true; return; } else return;
  bs.forEach((b,i)=>b.classList.toggle("on",i===hi)); e.preventDefault(); });
sug.addEventListener("mousedown",e=>{ const b=e.target.closest("button"); if(b) pick(b.dataset.c); });
document.addEventListener("click",e=>{ if(!e.target.closest(".search")) sug.hidden=true; });

render();
</script>
